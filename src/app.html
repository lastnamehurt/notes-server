<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191A23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/app/manifest.webmanifest">
<title>Day book</title>
<script>
// Restore appearance before the first paint. Browsers may block local storage.
function applyTheme(theme) {
  if (theme !== "light" && theme !== "dark") theme = "system";
  if (theme === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
    const dark = theme === "dark" || (theme === "system" && meta.media.includes("dark"));
    meta.content = dark ? "#191A23" : "#F6F5F2";
  });
}
let initialTheme = document.documentElement.dataset.theme || "system";
try { initialTheme = localStorage.getItem("daybook-theme") || initialTheme; } catch {}
applyTheme(initialTheme);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F5F2;
  --sheet: #FFFFFF;
  --ink: #242633;
  --ink-2: #696A7A;
  --rule: #DEDEE6;
  --control: #8C8C9E;
  --mark: #5453C6;
  --mark-ink: #FFFFFF;
  --done: #2F7659;
  --danger: #B33D48;
  --shadow: 0 2px 8px rgb(36 38 51 / .06), 0 1px 2px rgb(36 38 51 / .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #191A23; --sheet: #232530; --ink: #ECECF3; --ink-2: #AFB0C2;
    --rule: #414353; --control: #73758A; --mark: #A6A5FF; --mark-ink: #191A23;
    --done: #89CDA6; --danger: #FF9EA8;
    --shadow: 0 2px 10px rgb(0 0 0 / .18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #191A23; --sheet: #232530; --ink: #ECECF3; --ink-2: #AFB0C2;
  --rule: #414353; --control: #73758A; --mark: #A6A5FF; --mark-ink: #191A23;
  --done: #89CDA6; --danger: #FF9EA8;
  --shadow: 0 2px 10px rgb(0 0 0 / .18);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 "DM Sans", system-ui, sans-serif;
  min-height: 100dvh;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.shell { max-width: 680px; margin: 0 auto; padding: env(safe-area-inset-top) 20px 0; }
/* On a phone the page scrolls under the status bar (clock, battery): keep that strip solid so nothing collides. */
body::before { content: ""; position: fixed; z-index: 30; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--paper); pointer-events: none; }

/* Masthead: the date is the title of every page. */
.mast { padding: 22px 0 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.mastcopy { min-width: 0; }
.mast-actions { display: flex; align-items: center; gap: 8px; }
.appearance { position: relative; }
.appearance summary { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 50%; background: var(--sheet); color: var(--ink-2); cursor: pointer; list-style: none; box-shadow: var(--shadow); }
.appearance summary::-webkit-details-marker { display: none; }
.appearance svg { width: 20px; height: 20px; flex: none; }
.theme-menu { position: absolute; z-index: 20; right: 0; top: calc(100% + 8px); width: 160px; padding: 6px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / .18); }
.theme-menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 9px; background: none; color: var(--ink); text-align: left; font-size: 14px; }
.theme-menu button:hover, .theme-menu button[aria-pressed="true"] { background: var(--paper); }
.theme-menu button[aria-pressed="true"]::after { content: "✓"; margin-left: auto; color: var(--mark); font-weight: 700; }
.brand { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; color: var(--ink-2); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.brandmark { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--mark); color: var(--mark-ink); font: 16px/1 "DM Serif Display", Georgia, serif; letter-spacing: 0; }
.date { margin: 0; line-height: 1; }
.date .dow { display: block; font-size: 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 3px; }
.date .day { font: 400 clamp(48px, 13vw, 66px)/.98 "DM Serif Display", Georgia, serif; letter-spacing: -.035em; }
.date .mon { font: 400 20px/1 "DM Serif Display", Georgia, serif; margin-left: 7px; color: var(--ink-2); }
.lockbtn { min-height: 44px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 8px 15px; box-shadow: var(--shadow); }

/* Three sections, equal width, so the bar fits any phone without scrolling or a "More" menu. */
nav.tabs { position: relative; z-index: 15; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border: 1px solid var(--rule); border-radius: 14px; padding: 4px; margin: 0; background: color-mix(in srgb, var(--sheet) 68%, transparent); }
nav.tabs a { display: flex; justify-content: center; min-height: 44px; align-items: center; padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-size: 15px; font-weight: 600; border-radius: 10px; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
nav.tabs a[aria-current="page"] { color: var(--mark-ink); background: var(--mark); box-shadow: 0 1px 2px rgb(36 38 51 / .18); }
/* Pages inside the current section: quiet text links with an underline, clearly secondary to the tabs. */
nav.subtabs { display: flex; gap: 18px; margin: 12px 4px 0; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
nav.subtabs a { display: flex; align-items: center; min-height: 44px; padding: 0 2px; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.subtabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--mark); }
.gearbtn { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 50%; background: var(--sheet); color: var(--ink-2); box-shadow: var(--shadow); }
.gearbtn svg { width: 20px; height: 20px; }
.gearbtn[aria-current="page"] { color: var(--mark-ink); background: var(--mark); border-color: var(--mark); }

main { padding: 22px 0 calc(170px + env(safe-area-inset-bottom)); }
.empty { color: var(--ink-2); padding: 28px 0; }
.err { color: var(--danger); font-weight: 600; }

/* Today: the time rail. */
.rail { position: relative; margin: 0; padding: 0; list-style: none; }
.rail::before { content: ""; position: absolute; left: 76px; top: 6px; bottom: 6px; width: 2px; background: var(--rule); }
.ev { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 26px; padding: 10px 0; align-items: baseline; }
.ev time, .rem time { font-variant-numeric: tabular-nums; }
.ev time { text-align: right; color: var(--ink-2); font-size: 15px; white-space: nowrap; }
.ev::after { content: ""; position: absolute; left: 72px; top: 17px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.ev.done-ev::after { background: var(--done); }
.ev.up::after { background: var(--paper); box-shadow: inset 0 0 0 2px var(--mark); }
.ev .what { overflow-wrap: anywhere; }
.ev .tags { color: var(--ink-2); font-size: 15px; }
.ev.up .what { font-weight: 600; }
.ev .sub { display: block; font-size: 14px; color: var(--ink-2); }
.ev .body { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.ev .mk { flex: none; background: none; border: 1.5px solid var(--mark); color: var(--mark); border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 600; }
.now { position: relative; height: 0; margin: 14px 0; border-top: 2px solid var(--mark); }
.now span { position: absolute; left: 0; top: -12px; background: var(--mark); color: var(--mark-ink); font-size: 13px; font-weight: 800; padding: 2px 7px; border-radius: 4px; }
.later { margin: 28px 0 8px; font-size: 15px; color: var(--ink-2); }


/* Logs: mobile-first, full-width capture with quieter secondary actions. */
.logs-page { display: grid; gap: 18px; }
.logs-page .step { margin: 0; }
.logs-page .log-fields { display: grid; gap: 12px; }
.logs-page .log-fields label { display: block; margin: 0 0 5px; }
.logs-page input, .logs-page select, .logs-page textarea { box-sizing: border-box; width: 100%; min-width: 0; max-width: 100%; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
.logs-page textarea { resize: vertical; min-height: 88px; }
.logs-page .log-duration { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logs-page .log-duration input { width: 112px; }
.logs-page .log-duration .muted { flex: 1; min-width: 160px; margin: 0; font-size: 13px; }
.logs-page .log-submit { display: flex; justify-content: flex-end; margin-top: 6px; }
.logs-page .log-submit .btn { min-height: 44px; }
.logs-page .log-create { display: flex; gap: 10px; align-items: center; }
.logs-page .log-create input { flex: 1; }
.logs-page .log-create button { flex: none; }
.logs-page details.step summary { cursor: pointer; font-weight: 600; }
.logs-page .log-types { display: grid; gap: 8px; }
.logs-page .log-type-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.logs-page .log-type-row:last-child { border-bottom: 0; }

/* Composer: thumb zone. */
.composer { position: fixed; z-index: 8; left: 50%; right: auto; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100% - 24px), 640px); background: color-mix(in srgb, var(--sheet) 92%, transparent); border: 1px solid var(--rule); border-radius: 20px; padding: 12px 14px; box-shadow: 0 12px 36px rgb(36 38 51 / .13); backdrop-filter: blur(18px); }
.composer .in { max-width: 640px; margin: 0 auto; }
.composer-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 4px; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.composer[data-collapsed="true"] .in { display: none; }
.composer[data-collapsed="true"] { padding: 2px 12px; width: max-content; min-width: 140px; max-width: calc(100% - 24px); border-radius: 999px; }
.composer[data-collapsed="true"] .composer-toggle { min-height: 42px; gap: 20px; }
.composer:not([data-collapsed="true"]) { max-height: min(45dvh, 310px); overflow-y: auto; }
.composer[hidden] { display: none !important; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.chip { flex: none; min-height: 44px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 15px; color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 12px 14px; }
.row input:focus { border-color: var(--ink); outline: none; }
.btn { border: 0; background: var(--mark); color: var(--mark-ink); border-radius: 12px; padding: 12px 18px; font-weight: 700; }
.btn:disabled { opacity: .5; }
.btn.quiet { background: none; color: var(--ink); border: 1.5px solid var(--control); }
.btn.danger { background: none; color: var(--danger); border: 1.5px solid var(--danger); }

/* Lists */
.search { width: 100%; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h2.group { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 22px 0 4px; }
h2.group b { color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; }
.list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; }
.list a .t { font-weight: 600; overflow-wrap: anywhere; }
.list a .d { color: var(--ink-2); font-size: 15px; white-space: nowrap; }

/* Focus: a single compact row per task, with separators between tasks only. */
.focus .focus-tasks { margin: 10px 0 0; }
.focus .focus-task { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
.focus .focus-task:last-child { border-bottom: 0; padding-bottom: 0; }
.focus .focus-task-content { flex: 1; min-width: 0; }
.focus .focus-task-content > a { display: block; padding: 0; border: 0; line-height: 1.4; overflow-wrap: anywhere; }
.focus .task-due { font-size: 13px; margin-top: 4px; line-height: 1.35; }
.focus .task-priority { flex: none; width: auto; max-width: 120px; min-height: 36px; padding: 6px 8px; font-size: 13px; border-radius: 9px; }
@media (max-width: 420px) { .focus .focus-task { align-items: flex-start; } .focus .task-priority { max-width: 100px; } }

/* Visual Eisenhower focus: capture → quadrants → daily action. */
.focus-visual .focus-capture,.focus-visual .focus-daily{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.focus-visual .focus-capture-icon,.focus-visual .focus-daily>span{font-size:26px;color:var(--mark)}
.focus-visual .focus-capture strong,.focus-visual .focus-daily strong{font-size:20px}
.focus-visual .focus-capture p,.focus-visual .focus-daily p{margin:0;color:var(--ink-2);font-size:14px}
.focus-visual .focus-flow-arrow{text-align:center;color:var(--ink-2);font-size:24px;padding:10px}
.focus-visual .focus-quadrants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.focus-visual .focus-quadrant{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;min-height:148px;padding:14px 9px;border-radius:17px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;font:inherit}
.focus-visual .focus-quadrant.active,.focus-visual .focus-quadrant:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.focus-visual .focus-quadrant-icon{font-size:25px;color:var(--mark)}
.focus-visual .focus-quadrant strong{font-size:17px;line-height:1.2}
.focus-visual .focus-quadrant-description{font-size:12px;color:var(--ink-2);line-height:1.3}
.focus-visual .focus-quadrant-count{font-size:12px;font-weight:700;color:var(--mark)}
.focus-visual .focus-inbox{width:100%;text-align:left;margin:16px 0;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:12px;padding:14px;font:inherit}
.focus-visual .focus-detail{margin:12px 0;padding:18px;border:1px solid var(--rule);border-radius:16px;background:var(--sheet)}
.focus-visual .focus-detail[hidden]{display:none}
.focus-visual .focus-detail h3{margin:0 0 8px}
@media(max-width:360px){.focus-visual .focus-quadrant{min-height:135px}.focus-visual .focus-quadrant strong{font-size:15px}}

.log-to-task,.log-to-note{border:1px solid var(--rule);border-radius:9px;background:var(--sheet);color:var(--ink-2);font:inherit;font-size:12px;padding:7px 9px;flex-shrink:0}
.inbox-item{padding:16px 0;border-bottom:1px solid var(--rule)}.inbox-item>a{color:var(--ink);text-decoration:none}.inbox-item p{font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}.inbox-actions{display:flex;gap:8px;flex-wrap:wrap}.inbox-actions button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit;font-size:13px;min-height:42px}.inbox-actions button:disabled{opacity:.5}
.unified-task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}.unified-task>a{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--ink)}.unified-task .task-priority{max-width:105px}.task-done{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:9px;padding:9px}.task-group h4{margin:14px 0 4px}@media(max-width:420px){.unified-task{flex-wrap:wrap}.unified-task>a{flex-basis:100%}}
.quick-modes{display:flex;gap:6px;margin-bottom:8px}.quick-modes button{flex:1;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:9px;font:inherit}.quick-modes button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:700}
/* Today mobile density: actions remain available without dominating the timeline. */
.rail .ev{grid-template-columns:58px minmax(0,1fr) auto;column-gap:14px;align-items:center;padding:11px 0;min-height:42px}
.rail .ev::after{left:65px;top:19px;width:8px;height:8px}
.rail .ev time{font-size:12px}
.rail .ev .entry{min-width:0;text-align:left;overflow-wrap:anywhere}
.rail .ev .body{min-width:0;align-items:center}
.rail .ev .what{font-size:15px;line-height:1.4}
.rail .ev .tags,.rail .ev .sub{font-size:12px}
.rail .ev .mk{min-height:38px;padding:7px 12px}
.log-actions{position:relative;justify-self:end;align-self:center}
.log-actions summary{list-style:none;cursor:pointer;min-width:42px;min-height:42px;display:grid;place-items:center;color:var(--ink-2);font-weight:700;letter-spacing:2px;border-radius:10px}
.log-actions summary::-webkit-details-marker{display:none}
.log-actions[open] summary{background:var(--sheet)}
.log-actions-menu{position:absolute;right:0;top:100%;z-index:6;min-width:150px;display:grid;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.log-actions-menu button{min-height:42px;width:100%;text-align:left;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:9px}
.log-actions-menu button:focus-visible,.log-actions-menu button:hover{background:var(--sheet)}
.focus .focus-task{padding:9px 0;gap:8px}
.focus .focus-task-content>a{font-size:15px;line-height:1.35}
.focus .task-due{font-size:12px;margin-top:2px}
.focus .task-priority{max-width:96px;min-height:40px;padding:6px;font-size:12px}
@media(max-width:420px){.rail .ev{grid-template-columns:50px minmax(0,1fr) auto;gap:11px}.rail .ev::after{left:55px}.focus .focus-task{align-items:center}}

/* Today is a daily dashboard; quadrant planning belongs in Tasks. */
.today-dashboard{margin-bottom:14px}
.today-focus-heading,.today-activity-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.today-focus-heading h2,.today-activity-heading h2{margin:0;font-size:21px}
.today-focus-heading>a{font-size:13px;color:var(--mark);text-decoration:none}
.today-focus-card{background:var(--sheet);border:1px solid var(--rule);border-radius:17px;padding:12px 16px;margin-bottom:20px}
.today-focus-count{font-size:12px;color:var(--ink-2);margin-bottom:5px}
.today-focus-list{list-style:none;padding:0;margin:0}
.today-focus-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.today-focus-row:last-child{border-bottom:0}
.today-focus-dot{font-size:22px;color:var(--ink-2);line-height:1}
.today-focus-content{flex:1;min-width:0}
.today-focus-content a{display:block;color:var(--ink);text-decoration:none;font-size:15px;overflow-wrap:anywhere}
.today-focus-due{display:block;font-size:12px;margin-top:3px}
.today-focus-priority{font-size:11px;color:var(--mark);white-space:nowrap}
.today-focus-more{display:inline-block;padding:9px 0;color:var(--mark);font-size:13px}
.today-activity-heading{margin:18px 0 10px}
.today-activity-heading .muted{font-size:12px}

/* Notes browsing — readable rows and horizontally scrollable mobile filters. */
.notes-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.notes-heading h2{margin:0}
.notes-heading p{margin:4px 0 0;font-size:13px}
.notes-heading .btn{white-space:nowrap;text-decoration:none}
.notes-search-wrap{display:block}
.notes-search-wrap input{display:block;width:100%;box-sizing:border-box;margin:0;min-height:46px}
.notes-toolbar{display:flex;align-items:center;gap:12px;margin-top:12px}
.notes-filters{display:flex;flex:1;min-width:0;gap:7px;overflow-x:auto;scrollbar-width:none;padding:3px 1px 7px}
.notes-filters button{white-space:nowrap;flex:none;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink-2);padding:9px 13px;font:inherit;font-size:13px;min-height:40px;cursor:pointer}
.notes-filters button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.notes-inbox-link{font-size:12px;white-space:nowrap;color:var(--mark);text-decoration:none}
.notes-result-count{font-size:12px;margin:8px 0}
.notes-results{list-style:none;padding:0;margin:0}
.notes-result{border-bottom:1px solid var(--rule)}
.notes-result a{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;min-height:64px;padding:10px 2px}
.notes-result-icon{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--sheet);color:var(--ink-2)}
.notes-result-body{min-width:0;flex:1;display:grid;gap:5px}
.notes-result-body strong{font-size:15px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.notes-result-meta{font-size:12px;color:var(--ink-2)}
.notes-result-arrow{font-size:24px;color:var(--ink-2)}
@media(max-width:430px){.notes-toolbar{display:block}.notes-inbox-link{display:inline-block;margin:2px 0 4px}.notes-result a{gap:10px}}

/* Goals */
.goal { padding: 18px; border: 1px solid var(--rule); border-radius: 16px; background: var(--sheet); box-shadow: var(--shadow); margin: 0 0 12px; }
.goal h3 { margin: 0 0 4px; font: 400 24px/1.2 "DM Serif Display", Georgia, serif; letter-spacing: -.01em; }
.goal h3 a { color: inherit; text-decoration: none; }
.goal .meta { color: var(--ink-2); font-size: 15px; }
.meter { display: flex; gap: 3px; margin: 12px 0 10px; }
.meter i { flex: 1; height: 8px; border-radius: 2px; background: var(--rule); }
.meter i.on { background: var(--ink); }
.goal .next { font-size: 16px; }
.goal .next span { color: var(--ink-2); }

/* Reminders */
.rem { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.rem time { color: var(--ink-2); }
.rem .sub { display: block; font-size: 14px; color: var(--ink-2); }
.rem .sub a { color: inherit; }

/* Editor and forms: a top bar that stays put, so Save is never under the keyboard. */
.edbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); padding: 10px 0; margin: -10px 0 10px; border-bottom: 1px solid var(--rule); }
.edbar .left, .edbar .right { display: flex; gap: 8px; align-items: center; }
.link { background: none; border: 0; padding: 8px 2px; color: var(--ink); font-weight: 600; text-decoration: none; }
.link.back::before { content: "\2039"; font-size: 26px; line-height: 0; margin-right: 6px; position: relative; top: 2px; }
.btn.small { padding: 8px 16px; border-radius: 10px; }
.where { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
.field { display: block; margin: 0 0 14px; }
.field > span { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.field input, .field textarea, .field select, .title-in, textarea.body-in {
  width: 100%; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 11px 14px; }
.field input:focus, .field textarea:focus, .title-in:focus, textarea.body-in:focus { border-color: var(--ink); outline: none; }
.title-in { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 10px; }
textarea.body-in { min-height: 40dvh; line-height: 1.55; resize: none; overflow: hidden; }
.hint { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.doc { background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 8px 20px 18px; box-shadow: var(--shadow); overflow-wrap: anywhere; cursor: text; }
.doc h1 { font: 400 32px/1.15 "DM Serif Display", Georgia, serif; letter-spacing: -0.02em; margin: 16px 0 8px; }
.doc h2 { font-size: 20px; margin: 20px 0 6px; }
.doc h3 { font-size: 17px; margin: 16px 0 4px; }
.doc ul { padding-left: 20px; margin: 8px 0; }
.doc li.task { list-style: none; margin-left: -20px; padding: 3px 0; }
.doc li.task label { display: flex; min-height: 44px; padding: 8px 0; gap: 10px; align-items: flex-start; cursor: pointer; }
.doc li.task input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); flex: none; cursor: pointer; }
.doc li.task.checked span { color: var(--ink-2); text-decoration: line-through; }
.doc .when { color: var(--mark); font-weight: 600; white-space: nowrap; }
.doc code { background: var(--paper); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
.doc a { color: var(--ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.danger-link { display: block; margin: 36px 0 0; background: none; border: 0; padding: 8px 0; color: var(--danger); font-weight: 600; }

/* Centered editors with room to scroll on short screens. */
dialog.sheet { border: 1px solid var(--rule); padding: 0; width: calc(100% - 32px); max-width: 520px; margin: auto; background: var(--sheet); color: var(--ink); border-radius: 20px; max-height: calc(100dvh - 32px); overflow-y: auto; box-shadow: 0 24px 64px rgb(0 0 0 / .22); }
dialog.sheet::backdrop { background: rgb(10 14 30 / .45); }
dialog.sheet form { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
dialog.sheet h2 { margin: 0 0 14px; font-size: 21px; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 6px; }
.sheet-actions .spacer { flex: 1; }
.seg { display: inline-flex; border: 1.5px solid var(--control); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.seg button { background: none; border: 0; padding: 8px 16px; color: var(--ink-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.days { display: flex; gap: 6px; margin-bottom: 8px; }
.days button { flex: 1; aspect-ratio: 1; max-width: 44px; border-radius: 50%; border: 1.5px solid var(--control); background: var(--sheet); font-weight: 600; color: var(--ink-2); }
.days button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.repeat-say { font-size: 14px; color: var(--ink-2); margin: 0 0 14px; }
.two { display: flex; gap: 10px; } .two .field { flex: 1; min-width: 0; }
.formerr { color: var(--danger); font-weight: 600; margin: 0 0 10px; }

/* Log rows are tappable */
.ev button.entry { all: unset; cursor: pointer; display: block; }
.ev button.entry:focus-visible { outline: 2px solid var(--mark); outline-offset: 4px; border-radius: 4px; }
.ev.due::after { background: var(--mark); }
.ev.due .sub { color: var(--mark); }
.timebtn { flex: none; min-height: 44px; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 0 12px; font-weight: 600; color: var(--ink-2); min-width: 64px; }
.timebtn.set { color: var(--ink); border-color: var(--ink); }
#when { flex: none; width: 112px; }
.goal .next { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.goal .next input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }
.goal .next .lbl { color: var(--ink-2); }
.rem { grid-template-columns: 76px 1fr auto; align-items: start; }
.rem .mk, .ev .mk { flex: none; min-height: 44px; background: none; border: 1.5px solid var(--mark); color: var(--mark); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.rem a.what { color: inherit; text-decoration: none; }

/* Lock */
.lock { padding-top: 10dvh; }
.storage-choice label { align-items: flex-start; }
.storage-choice input { margin-top: 3px; }
.update-banner { border: 1.5px solid var(--mark); }
.ok-line { font-weight: 600; }
.instructions { margin: 10px 0 14px; padding: 12px 14px; border-left: 3px solid var(--mark); background: var(--paper, rgba(127,127,127,.08)); border-radius: 0 10px 10px 0; font-size: 15px; line-height: 1.5; }
.paste-where { padding-left: 20px; }
.paste-where li { margin: 6px 0; }
.update-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.update-actions .update-repo { flex: 1 1 100%; }
.update-repo label { font-weight: 600; }
.update-repo .copyrow input { flex: 1; min-width: 0; }
.lock-alt { padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--rule); }
.lock p { color: var(--ink-2); max-width: 32ch; }
.lock input { width: 100%; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 13px 14px; margin: 8px 0 12px; }
.lock label { font-weight: 600; }


/* Setup */
.setup h2 { font-size: 24px; letter-spacing: -0.01em; margin: 6px 0 4px; }
.setup .lede { color: var(--ink-2); margin: 0 0 18px; }
.step { background: var(--sheet); border-radius: 14px; padding: 16px 16px 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
.step h3 { margin: 0 0 6px; font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.step h3 .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 14px; display: inline-grid; place-items: center; }
.step.ok h3 .n { background: var(--done); }
.step p, .step ol { margin: 6px 0 10px; }
.step ol { padding-left: 20px; }
.step li { margin: 4px 0; }
.step .muted { color: var(--ink-2); font-size: 15px; }
.step input[type=text], .step input[type=password], .step select { width: 100%; border: 1.5px solid var(--control); background: var(--paper); border-radius: 12px; padding: 12px 14px; margin: 4px 0 10px; }
.step label { font-weight: 600; display: block; }
.btn.a-btn { display: inline-block; text-decoration: none; }
.choices { list-style: none; padding: 0; margin: 6px 0 10px; }
.choices label { display: flex; gap: 10px; align-items: center; font-weight: 400; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.choices input { width: 20px; height: 20px; accent-color: var(--ink); }
.copyrow { display: flex; gap: 8px; align-items: center; }
.ghcode { font-size: 28px !important; letter-spacing: .12em; text-align: center; font-weight: 600; }
.gh-ok { color: var(--done); font-weight: 600; }
.copyrow code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.apple-state { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; }
.apple-state.ok { border-color: color-mix(in srgb, var(--done) 45%, var(--rule)); }
.apple-state.warn { border-color: color-mix(in srgb, var(--mark) 55%, var(--rule)); }
.apple-steps { padding-left: 20px; display: grid; gap: 10px; }
.apple-steps .copyrow { margin-top: 6px; }
.apple-alerts { border: 0; padding: 0; margin: 14px 0 0; }
.apple-alerts legend { font-weight: 600; margin-bottom: 6px; }
.apple-alerts label { display: flex; gap: 10px; align-items: center; min-height: 44px; margin: 0; }
.apple-alerts input { width: auto; flex: none; }
details.more summary { min-height: 44px; padding: 10px 0; cursor: pointer; color: var(--ink-2); margin: 4px 0; }
.toast { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 28px rgb(0 0 0 / .18); }
@media (max-width: 480px) {
  .shell { padding-left: 16px; padding-right: 16px; }
  .mast { padding-top: 16px; }
  nav.tabs { gap: 2px; }
  nav.tabs a { padding: 8px 8px; font-size: 14px; }
  .ev { grid-template-columns: 52px 1fr; gap: 20px; }
  .rail::before { left: 64px; }
  .ev::after { left: 60px; }
  .composer { bottom: calc(10px + env(safe-area-inset-bottom)); padding: 10px; }
  .chips { gap: 6px; }
  .chip { padding-left: 10px; padding-right: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
}
.undo-button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:7px;padding:5px 10px;margin-left:8px;font:inherit;font-weight:700;cursor:pointer}.undo-button:disabled{opacity:.5}
/* Promised Today mobile layout: a single compact dashboard and activity timeline. */

/* Timeline geometry: one source of truth. The rail line and dots are placed from the
   time-column width (--tl-time) and the gap (--tl-gap), so they can never overlap text. */
.rail{--tl-time:64px;--tl-gap:32px;--tl-dot:10px;--tl-line:21px}
.rail::before{left:calc(var(--tl-time) + var(--tl-gap) / 2 - 1px);top:14px;bottom:14px}
.rail .ev{grid-template-columns:var(--tl-time) minmax(0,1fr) auto;column-gap:var(--tl-gap);align-items:start;padding:12px 0;min-height:0}
.rail .ev::after{left:calc(var(--tl-time) + var(--tl-gap) / 2 - var(--tl-dot) / 2);top:calc(12px + (var(--tl-line) - var(--tl-dot)) / 2);width:var(--tl-dot);height:var(--tl-dot)}
.rail .ev time{font-size:13px;line-height:var(--tl-line)}
.rail .ev .what{display:block;font-size:15px;line-height:var(--tl-line)}
.rail .ev .entry .what{display:inline}
.rail .ev .sub{margin-top:3px;line-height:1.35}
.rail .ev .body{column-gap:14px;align-items:center}
.rail .ev .mk,.rail .ev>.log-actions{align-self:center}
.rail + .rail{margin-top:0}
.now{margin:18px 0}
.later{margin:28px 0 6px}
@media(max-width:480px){.rail{--tl-time:52px;--tl-gap:28px}}
@media(max-width:360px){.rail{--tl-time:46px;--tl-gap:24px}}

<body>
<div class="shell">
  <header class="mast">
    <div class="mastcopy">
      <p class="brand"><span class="brandmark" aria-hidden="true">d</span> Daybook</p>
      <h1 class="date" id="date"></h1>
    </div>
    <div class="mast-actions">
      <details class="appearance" id="appearance">
        <summary id="theme-toggle" aria-label="Appearance: System" title="Appearance: System"></summary>
        <div class="theme-menu" role="group" aria-label="Appearance">
          <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </details>
      <a class="gearbtn" href="#settings" id="settingsTab" hidden aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></a>

  <button class="composer-toggle" id="composer-toggle" type="button" aria-expanded="true" aria-controls="composer-fields"><span id="composer-label">Capture something</span><span id="composer-chevron" aria-hidden="true">⌄</span></button>
  <div class="in">
    <div class="quick-modes" role="group" aria-label="Save as"><button type="button" data-quick-mode="note" aria-pressed="true">Thought</button><button type="button" data-quick-mode="task" aria-pressed="false">Task</button><button type="button" data-quick-mode="log" aria-pressed="false">Activity</button></div><div class="chips" id="chips" role="group" aria-label="Tags" hidden></div><div class="chips" id="task-when" role="group" aria-label="When" hidden><button type="button" class="chip" data-quick-when="none" aria-pressed="true">No date</button><button type="button" class="chip" data-quick-when="today" aria-pressed="false">Today</button><button type="button" class="chip" data-quick-when="tomorrow" aria-pressed="false">Tomorrow</button><button type="button" class="chip" data-quick-when="more" aria-pressed="false">More…</button></div>

</form>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script>
"use strict";
const TAGS = ["food", "drink", "med", "exercise", "sleep", "mood"];
const DAYS = ["S", "M", "T", "W", "T", "F", "S"];
const DAY_IDS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const DAY_NAMES = ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"];
const SHORT_DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
/** "Repeats Mon, Wed, Fri–Sun · 7am" from a task's schedule ({days: 0–6, minutes past midnight}). */
function repeatLabel(repeat) {
  const set = new Set(repeat.days);
  let days;
  if (set.size === 7) days = "daily";
  else if (set.size === 5 && [1,2,3,4,5].every(d => set.has(d))) days = "weekdays";
  else if (set.size === 2 && set.has(0) && set.has(6)) days = "weekends";
  else {
    // Monday-first, with runs of three or more joined by a dash.
    const order = [1,2,3,4,5,6,0].filter(d => set.has(d)), runs = [];
    for (const d of order) { const last = runs.at(-1); if (last && ([1,2,3,4,5,6,0].indexOf(d) === [1,2,3,4,5,6,0].indexOf(last.at(-1)) + 1)) last.push(d); else runs.push([d]); }
    days = runs.flatMap(r => r.length >= 3 ? [SHORT_DAYS[r[0]] + "\u2060–\u2060" + SHORT_DAYS[r.at(-1)]] : r.map(d => SHORT_DAYS[d])).join(", ");
  }
  const times = repeat.minutes.map(m => fmt12(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"))).join(", ");
  return "Repeats " + days + " · " + times;
}
const $ = (s, el = document) => el.querySelector(s);
const appearance = $("#appearance"), themeToggle = $("#theme-toggle");
const themeIcons = {
  system: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
  dark: '<path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/>'
};
const themeIcon = theme => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${themeIcons[theme]}</svg>`;
function drawThemeChoice() {
  const theme = document.documentElement.dataset.theme || "system";
  const label = "Appearance: " + theme[0].toUpperCase() + theme.slice(1);
  themeToggle.innerHTML = themeIcon(theme);
  themeToggle.setAttribute("aria-label", label); themeToggle.title = label;
  appearance.querySelectorAll("[data-theme-choice]").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme));
    button.innerHTML = themeIcon(button.dataset.themeChoice) + button.dataset.themeChoice[0].toUpperCase() + button.dataset.themeChoice.slice(1);
  });
}
drawThemeChoice();
appearance.addEventListener("click", e => {
  const button = e.target.closest("[data-theme-choice]"); if (!button) return;
  applyTheme(button.dataset.themeChoice);
  try { localStorage.setItem("daybook-theme", button.dataset.themeChoice); } catch {}
  drawThemeChoice(); appearance.open = false; themeToggle.focus();
});
document.addEventListener("click", e => { if (!appearance.contains(e.target)) appearance.open = false; });
appearance.addEventListener("keydown", e => {
  if (e.key === "Escape") { appearance.open = false; themeToggle.focus(); e.preventDefault(); }
});
// Each top-level section and the pages inside it. A page's section decides which tab is highlighted and
// which switcher (if any) is shown under the tabs. Routes not listed here (note, new, setup…) map below.
const SECTIONS = {
  today: [["today", "Today"], ["spending", "Spending"], ["awareness", "Suggestions"]],
  reminders: [["reminders", "Tasks"], ["goals", "Goals"]],
  notes: [["notes", "Notes"], ["journal", "Journal"], ["logs", "Logs"]]
};
function sectionOf(view, arg) {
  if (view === "inbox") return ["notes", "notes"];
  if (view === "new-goal") return ["reminders", "goals"];
  if (view === "note" || view === "new") return arg.startsWith("goals") ? ["reminders", "goals"] : ["notes", "notes"];
  for (const [section, pages] of Object.entries(SECTIONS)) if (pages.some(([id]) => id === view)) return [section, view];
  return [null, view];
}
function drawNav(view, arg) {
  const [section, page] = sectionOf(view, arg);
  const mark = (el, on) => on ? el.setAttribute("aria-current", "page") : el.removeAttribute("aria-current");
  document.querySelectorAll("#tabs a").forEach(a => mark(a, a.getAttribute("href") === "#" + section));
  mark($("#settingsTab"), view === "settings" || view === "setup");
  const sub = $("#subtabs"), pages = section && SECTIONS[section];
  // Today's switcher only appears on the Suggestions page, to keep the main screen uncluttered.
  const show = pages && !$("#tabs").hidden && (section !== "today" || page !== "today");
  sub.hidden = !show;
  sub.innerHTML = show ? pages.map(([id, label]) => h`<a href="#${id}" ${id === page ? raw('aria-current="page"') : ""}>${label}</a>`).join("") : "";
}
const main = $("#main");
const sheet = $("#sheet");
let cfg = { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone, categories: [], push: true };

const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const h = (strings, ...vals) => strings.reduce((out, s, i) => out + s + (i < vals.length ? (vals[i] && vals[i].__html !== undefined ? vals[i].__html : esc(vals[i] ?? "")) : ""), "");
const raw = html => ({ __html: html });

/* ---------- Time, always in the owner's time zone ---------- */
const parts = (ms = Date.now()) => Object.fromEntries(new Intl.DateTimeFormat("en-US", {
  timeZone: cfg.timeZone, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
}).formatToParts(new Date(ms)).map(p => [p.type, p.value]));
const dayKey = ms => { const p = parts(ms); return p.year + "-" + p.month + "-" + p.day; };
const hhmm = ms => { const p = parts(ms); return p.hour + ":" + p.minute; };
const fmt12 = t => { let [H, M] = t.split(":").map(Number); const ap = H >= 12 ? "pm" : "am"; H = H % 12 || 12; return H + (M ? ":" + String(M).padStart(2, "0") : "") + ap; };
const longDay = ms => new Intl.DateTimeFormat("en-US", { timeZone: cfg.timeZone, weekday: "short", month: "short", day: "numeric" }).format(new Date(ms));
const shortDate = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

/** "Good morning, Courtney" in the owner's time zone; plain "Today" until they've told us their name. */
function greeting(now = new Date()) {
  if (!cfg.name) return "Today";
  const hour = Number(new Intl.DateTimeFormat("en-US", { timeZone: cfg.timeZone, hour: "numeric", hourCycle: "h23" }).format(now));
  return (hour < 5 ? "Good evening" : hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening") + ", " + cfg.name;
}

function drawDate() {
  const now = new Date();
  const f = o => new Intl.DateTimeFormat("en-US", { timeZone: cfg.timeZone, ...o }).format(now);
  $("#date").innerHTML = h`<span class="dow">${f({ weekday: "long" })}</span><span class="day">${f({ day: "numeric" })}</span><span class="mon">${f({ month: "short" })}</span>`;
}

let toastTimer, nextToast = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.role = "status"; t.textContent = msg;
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}

/* Revision-checked undo: never overwrite changes made after the original action. */
let undoAction = null;
function offerUndo(message, action) {
  undoAction = action;
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.role = "status";
  const label = document.createElement("span"); label.textContent = message + " ";
  const button = document.createElement("button");
  button.type = "button"; button.textContent = "Undo"; button.className = "undo-button";
  button.onclick = async () => {
    if (undoAction !== action) return;
    button.disabled = true;
    try { await action(); undoAction = null; t.remove(); toast("Change undone"); }
    catch (err) { undoAction = null; t.remove(); handle(err); }
  };
  t.append(label,button); document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (undoAction === action) undoAction = null; t.remove(); }, 10000);
}
async function undoNoteChange(name, previous, expectedCurrent) {
  const current = await api("/note?name=" + encodeURIComponent(name));
  if (current.content.trimEnd() !== expectedCurrent.trimEnd()) throw new Error("This note changed again. Undo cancelled to protect newer edits.");
  await api("/note", {method:"PUT",body:{name,content:previous,sha:current.sha}});
}

class Locked extends Error {}
async function api(path, opts = {}) {
  const res = await fetch("/app/api" + path, {
    ...opts, credentials: "same-origin",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401) throw new Locked();
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ")");
  return data;
}
function savedMessage(res, base) {
  const n = res && res.reminders ? res.reminders.length : 0;
  let msg = base + (n ? ", " + n + " reminder" + (n > 1 ? "s" : "") + " set" : "");
  if (res && res.warning) msg += /NTFY_TOPIC/.test(res.warning) ? ". Phone notifications are off (turn them on in Settings)." : ". " + res.warning;
  return msg;
}

/* ---------- Note names and Markdown ---------- */
function titleFrom(name, content) {
  const head = content && /^#\s+(.+)$/m.exec(content);
  if (head) return head[1].trim();
  const file = name.split("/").pop().replace(/\.md$/, "");
  const m = /^\d{4}-\d{2}-\d{2}-(.+)$/.exec(file);
  const slug = m ? m[1] : file;
  if (/^\d{8}T\d{6}Z?-[0-9a-f]{8}$/.test(slug) || slug === "note") return "Untitled note";
  return slug.replace(/-\d+$/, "").replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
}
function dateFrom(name) {
  const m = /(\d{4})-?(\d{2})-?(\d{2})/.exec(name.split("/").pop());
  return m ? shortDate(m[1] + "-" + m[2] + "-" + m[3]) : "";
}
const folderName = c => ({ inbox: "Inbox", goals: "Goals", projects: "Projects", decisions: "Decisions", runbooks: "Runbooks", reference: "Reference", journal: "Journal" }[c] || c);
/** Split a note into its "# Title" line and the rest. */
function splitTitle(content) {
  const m = /^\s*#\s+(.*)\n?/.exec(content);
  if (!m) return { title: "", body: content.replace(/^\n+/, "") };
  return { title: m[1].trim(), body: content.slice(m[0].length).replace(/^\n+/, "") };
}
const joinTitle = (title, body) => (title.trim() ? "# " + title.trim() + "\n\n" : "") + body.replace(/\s+$/, "") + "\n";

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>');
}
const SCHED = /\s+@((?:\d{4}-\d{2}-\d{2}|daily|everyday|weekdays|weekends|[a-z]{3,9}(?:,[a-z]{3,9})*)(?:\s+[\d:apm, ]+)?)\s*$/i;
function niceSched(spec) {
  const [when, ...times] = spec.trim().split(/\s+/);
  const t = times.join(" ").split(",").map(x => x.trim()).filter(Boolean).map(x => /^\d{1,2}:\d{2}$/.test(x) ? fmt12(x) : x).join(", ");
  const day = /^\d{4}-\d{2}-\d{2}$/.test(when) ? shortDate(when)
    : ({ daily: "daily", everyday: "daily", weekdays: "weekdays", weekends: "weekends" }[when.toLowerCase()] || when.replace(/,/g, ", "));
  return day + (t ? ", " + t : "");
}
const PRIORITY_LABEL = { do: "Do now", plan: "Plan", delegate: "Handle later", someday: "Someday" };
/** A task's words without the stored codes, and its schedule in plain words: "Call airline" + "Oct 12, 11:30pm". */
function taskParts(text) {
  let body = text.replace(/\s+\^[a-z0-9]{4,12}\s*$/, "");
  const p = /(?:^|\s)@priority:(do|plan|delegate|someday)\b/i.exec(body);
  if (p) body = (body.slice(0, p.index) + body.slice(p.index + p[0].length)).trim();
  const s = SCHED.exec(body);
  return { title: s ? body.slice(0, s.index).trim() : body.trim(), when: s ? niceSched(s[1]) : "", priority: p ? p[1].toLowerCase() : "" };
}
function render(md) {
  const out = []; let list = false; let para = [];
  const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const close = () => { if (list) { out.push("</ul>"); list = false; } };
  md.split("\n").forEach((line, i) => {
    let m;
    // HTML comments are hidden markers (e.g. the journal's generated Activity section): never show them.
    if (/^\s*<!--.*-->\s*$/.test(line)) return;
    if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { flush(); close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); return; }
    if ((m = /^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/.exec(line))) {
      flush(); if (!list) { out.push("<ul>"); list = true; }
      const checked = m[1] !== " ";
      // Show the task's words with its date and priority as plain labels, never the stored codes.
      const t = taskParts(m[2]);
      out.push(`<li class="task${checked ? " checked" : ""}"><label><input type="checkbox" data-line="${i}" ${checked ? "checked" : ""}><span>${inline(t.title)}${t.when ? ` <span class="when">${esc(t.when)}</span>` : ""}${t.priority ? ` <span class="pri-badge">${esc(PRIORITY_LABEL[t.priority])}</span>` : ""}</span></label></li>`);
      return;
    }
    if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { flush(); if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(m[1]) + "</li>"); return; }
    if (!line.trim()) { flush(); close(); return; }
    close(); para.push(line);
  });
  flush(); close();
  return out.join("");
}
/** Tick or untick task line `i` of a note and save. */
async function setTask(name, content, i, done, sha) {
  const lines = content.split("\n");
  lines[i] = lines[i].replace(/\[( |x|X)\]/, done ? "[x]" : "[ ]");
  const next = lines.join("\n");

/** Plain-language confirmation for an added task: "Added for tomorrow at 5pm", "Added to Tasks". */
function addedMessage(when, date, time, repeatSay) {
  const at = time ? " at " + fmt12(time) : "";

  if (when === "today") return "Added for today" + (at || " (9am reminder)");
  if (when === "tomorrow") return "Added for tomorrow" + (at || " (9am reminder)");
  if (when === "pick") return "Added for " + new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }).format(new Date(date + "T12:00:00Z")) + (at || " (9am reminder)");

/** Turn the form's choices into the schedule the server stores, or an error message for the person. */
function scheduleFor(when, { date, time, days }) {
  const today = dayKey(Date.now());
  if (when === "none") return { schedule: "" };
  if (when === "repeat") {
    const d = [...days].sort();
    if (!d.length) return { error: "Pick at least one day." };
    if (!time) return { error: "Pick a time for the repeating reminder." };
    const spec = d.length === 7 ? "daily" : d.join() === "1,2,3,4,5" ? "weekdays" : d.join() === "0,6" ? "weekends" : d.map(i => DAY_IDS[i]).join(",");
    return { schedule: spec + " " + time };
  }
  const day = when === "today" ? today : when === "tomorrow" ? addDays(today, 1) : date;
  if (!day) return { error: "Pick a day." };
  if (!time && day === today && hhmm(Date.now()) >= "09:00") return { error: "It's past 9am, so pick a time for today." };
  return { schedule: day + (time ? " " + time : ""), day };
}

views.today = async () => {

  }

  const later = rems.upcoming.filter(r => dayKey(r.at) > today).slice(0, 3);

  const row = it => {
    if (it.kind === "log") {
      const tags = (it.text.match(/#[\w-]+/g) || []).join(" ");
      const what = it.text.replace(/\s*#[\w-]+/g, "").trim();
      return h`<li class="ev${/^✓/.test(what) ? " done-ev" : ""}"><time>${fmt12(it.t)}</time><button class="entry" data-line="${it.line}" aria-label="Edit ${what} at ${fmt12(it.t)}"><span class="what">${what}</span> <span class="tags">${tags}</span></button><details class="log-actions"><summary aria-label="Actions for ${what}">•••</summary><div class="log-actions-menu"><button class="log-to-task" type="button" data-entry="${what}" data-date="${today}">Make task</button><button class="log-to-note" type="button" data-entry="${what}" data-date="${today}">Save as note</button></div></details></li>`;
    }
    const due = it.t <= nowT;
    return h`<li class="ev ${due ? "due" : "up"}"><time>${fmt12(it.t)}</time><div class="body"><div><span class="what">${it.r.text}</span>
      <span class="sub">${due ? "Due, " : ""}<a href="#note/${it.r.note}" style="color:inherit">${titleFrom(it.r.note)}</a>${it.r.repeat ? ", repeats" : ""}</span></div>
      <button class="mk" data-note="${it.r.note}" data-text="${it.r.text}" data-at="${it.r.at}" aria-label="Mark ${it.r.text} done">Done</button></div></li>`;
  };
  let html;
  if (!items.length) {
    html = `<p class="empty">Nothing logged yet today. Use the box at the bottom to log a meal, a drink, your meds or how you're feeling.</p>`;
  } else {
    const before = items.filter(i => i.t <= nowT), after = items.filter(i => i.t > nowT);
    html = (before.length ? '<ol class="rail">' + before.map(row).join("") + "</ol>" : "")
      + `<div class="now" role="separator" aria-label="Now"><span>${esc(fmt12(nowT))}</span></div>`
      + (after.length ? '<ol class="rail">' + after.map(row).join("") + "</ol>" : "");
  }
  if (later.length) {
    html += '<p class="later">Coming up</p><ol class="rail">' + later.map(r =>
      h`<li class="ev up"><time>${longDay(r.at).replace(/^\w+, /, "")}</time><div><a class="what" href="#note/${r.note}" style="color:inherit;text-decoration:none">${r.text}</a><span class="sub">${fmt12(hhmm(r.at))}</span></div></li>`).join("") + "</ol>";
  }
  if (!cfg.push) html += `<p class="hint">Reminders show here, but phone notifications are off.${cfg.canSetup ? ' Turn them on in <a href="#settings">Settings</a>.' : ""}</p>`;
  // Presentation only: preserve the raw @date tokens in Markdown for MCP and reminders.
  const taskDate = task => task.dueAt === null || task.dueAt === undefined ? null : {date:new Date(task.dueAt),title:task.title};
  const displayTaskDate = date => {
    const delta = Math.round((Date.parse(dayKey(date.getTime()) + "T12:00:00Z") - Date.parse(dayKey(Date.now()) + "T12:00:00Z"))/86400000);
    // Overdue is already the row's label on the right, so the date line just gives the date.
    const relative = delta < 0 ? "" : delta === 0 ? "Today" : delta === 1 ? "Tomorrow" : delta <= 7 ? "In " + delta + " days" : "";
    const calendar = new Intl.DateTimeFormat(undefined,{timeZone:cfg.timeZone,weekday:"short",month:"short",day:"numeric"}).format(date);
    return (relative ? relative + " · " : "") + (delta === 0 || delta === 1 ? "" : calendar + " · ") + fmt12(hhmm(date.getTime()));
  };
  // GTD inbox and Eisenhower focus; priorities are explicit, never guessed from note content.
  try {
    const tasks = await api("/priorities");
    const groups = [
      ["do", "Do now", "Urgent and important"],
      ["plan", "Plan", "Important, not urgent"],
      ["delegate", "Handle or delegate", "Urgent, lower importance"],
      ["someday", "Someday / maybe", "Not urgent"],
      ["inbox", "No priority", "Unsorted tasks"]
    ];
    const todayKey = dayKey(Date.now());
    // The server's title has the schedule (@2026-10-14 9am, @mon,wed 07:00) and priority tag removed.
    const annotated = tasks.map(t => ({...t,text:t.title || t.text,due:taskDate(t)}));
    const completedToday = entries.filter(e => /^✓\s/.test(e.text)).map(e => e.text.replace(/^✓\s*/, "").replace(/\s*#[\w-]+/g, "").trim().toLowerCase());
    const normalized = text => text.replace(/\s*@\d{4}-\d{2}-\d{2}.*$/, "").replace(/\s+/g," ").trim().toLowerCase();
    const doneKeys = new Set((rems.doneToday || []).map(r => key(r)));
    const dueReminders = [...(rems.firedToday || []), ...(rems.upcoming || [])]
      .filter(r => !doneKeys.has(key(r)) && dayKey(r.at) <= todayKey);
    const activeTasks = annotated.filter(t => !completedToday.includes(normalized(t.text)))
      .filter(t => t.priority === "do" || (t.due && dayKey(t.due.date.getTime()) <= todayKey))
      .map(t => ({...t, reminder: dueReminders.find(r => r.note === t.note && normalized(r.text) === normalized(t.text))}));
    for (const r of dueReminders) {
      if (activeTasks.some(t => t.reminder && key(t.reminder) === key(r))) continue;
      if (completedToday.includes(normalized(r.text))) continue;
      activeTasks.push({note:r.note,text:r.text,priority:"",due:{date:new Date(r.at),title:r.text},reminder:r});
    }
    activeTasks.sort((a,b) => (a.due?.date.getTime() ?? Infinity)-(b.due?.date.getTime() ?? Infinity));
    const topTasks = activeTasks.slice(0,4).map(t => h`<li class="today-focus-row"><button type="button" class="today-focus-dot" data-note="${t.note}" data-line="${t.line ?? ""}" data-text="${t.reminder ? t.reminder.text : ""}" data-at="${t.reminder ? t.reminder.at : ""}" aria-label="Mark ${t.due ? t.due.title : t.text} done">○</button><div class="today-focus-content"><a href="#note/${t.note}">${t.due ? t.due.title : t.text}</a>${t.due ? raw(h`<span class="muted today-focus-due">${displayTaskDate(t.due.date)}</span>`) : t.repeat ? raw(h`<span class="muted today-focus-due">${repeatLabel(t.repeat)}</span>`) : ""}</div><span class="today-focus-priority">${t.due && t.due.date < Date.now() ? "Overdue" : t.priority === "do" ? "Do now" : "Due today"}</span></li>`).join("");
    let spend = null;
    try { spend = await api("/signals/today"); } catch { spend = null; }
    const dateLabel = new Intl.DateTimeFormat(undefined,{timeZone:cfg.timeZone,weekday:"long",month:"long",day:"numeric"}).format(new Date());
    html = h`<section class="today-dashboard promised-today">
      <div class="today-date-label">${dateLabel}</div>
      <div class="today-top-heading"><h2>${greeting()}</h2></div>
      ${spend && spend.enabled ? raw(h`<a class="today-spend" href="#spending"><span>Spent today</span><b>$${spend.summary.today.toFixed(2)}</b><span class="muted">${spend.summary.todayCount} ${spend.summary.todayCount === 1 ? "payment" : "payments"} · week $${spend.summary.weekTotal.toFixed(2)}</span></a>`) : ""}
      <div class="today-focus-card">
        <div class="today-focus-heading"><h3>Focus</h3><span class="muted">${activeTasks.length} priorities</span></div>
        ${activeTasks.length ? raw('<ul class="today-focus-list">'+topTasks+'</ul>') : raw('<p class="muted">Nothing urgent right now.</p>')}
        ${activeTasks.length > 4 ? raw(h`<a class="today-focus-more" href="#reminders">View ${activeTasks.length-4} more →</a>`) : ""}
      </div>
      <div class="today-activity-heading"><h2>Activity</h2><span class="muted">Today</span></div>
    </section>` + html;
  } catch { html = '<p class="hint">Priorities are temporarily unavailable.</p>' + html; }
  main.innerHTML = html;
  main.querySelectorAll(".log-to-task").forEach(button => button.onclick = async () => {
    button.disabled = true;
    // Opens the Add a task form with the log entry filled in, so a date or priority can be set.
    taskSheet({ prefill: button.dataset.entry.replace(/^✓\s*/, "").trim(), onSaved: () => views.today() });
    button.disabled = false;
  });
  main.querySelectorAll(".log-to-note").forEach(button => button.onclick = () => captureSheet(button.dataset.entry, "Journal " + button.dataset.date));
  // Focus circles complete the task: a reminder's occurrence, or the task line itself.
  main.querySelectorAll(".today-focus-dot").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "✓";
    try {
      if (b.dataset.at) await complete(b.dataset.note, b.dataset.text, +b.dataset.at);
      else { const note = await api("/note?name=" + encodeURIComponent(b.dataset.note)); await setTask(b.dataset.note, note.content, Number(b.dataset.line), true, note.sha); }
      views.today();
    } catch (e) { handle(e); b.disabled = false; b.textContent = "○"; }
  });
  main.querySelectorAll(".task-priority").forEach(select => select.onchange = async () => {
    select.disabled = true;
    try {
      const note = await api("/note?name=" + encodeURIComponent(select.dataset.note));
      await api("/priorities", { method: "POST", body: {
        name: select.dataset.note, line: Number(select.dataset.line), priority: select.value, sha: note.sha
      } });
      await views.today();
    } catch (e) { handle(e); select.disabled = false; }
  });
  main.querySelectorAll(".mk").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await complete(b.dataset.note, b.dataset.text, +b.dataset.at); views.today(); }
    catch (e) { handle(e); b.disabled = false; }
  });
  main.querySelectorAll("button.entry").forEach(b => b.onclick = () => {
    const m = /^- (\d{2}:\d{2}) (.*)$/.exec(b.dataset.line);
    // Safari does not focus clicked buttons; give the dialog a return target.
    b.focus({ preventScroll: true });
    logEntrySheet(today, b.dataset.line, m[1], m[2]);
  });
  showUpdateBanner();
};

views.logs = async () => {
  $("#composer").hidden = true;
  main.innerHTML = h`<div class="setup logs-page">

    <section class="step"><h3>Record activity</h3>
      <div class="log-fields">

        <div><label for="typed-entry">What did you do?</label><textarea id="typed-entry" rows="2" placeholder="e.g. Walked around the neighborhood"></textarea></div>

  </div>`;
  const refresh = async () => {
    const [allTypes, summary] = await Promise.all([api("/log-types"), api("/time-summary")]);
    const types = allTypes.filter(t => t.name !== "done");
     $("#time-summary").innerHTML = h`<p><strong>${(summary.trackedMinutes/60).toFixed(1)} hours tracked</strong> across ${summary.sessionCount} sessions</p>${raw(summary.byType.map(t => h`<div class="log-type-row"><span>${t.type}</span><strong>${(t.minutes/60).toFixed(1)}h</strong></div>`).join(""))}`;

  };
  let backfillDates = [];
  $("#journal-backfill-preview").onclick = async () => {
    try {
      const result = await api("/journal/backfill");
      backfillDates = result.dates;
      $("#journal-backfill-status").textContent = result.pending
        ? result.pending + " of " + result.total + " logged days need journal updates."
        : "All " + result.total + " logged days are already synchronized.";
      $("#journal-backfill-run").hidden = !result.pending;
    } catch (e) { handle(e); }
  };
  $("#journal-backfill-run").onclick = async () => {
    const button = $("#journal-backfill-run");
    if (!backfillDates.length || !confirm("Backfill " + backfillDates.length + " daily journals? Existing reflections will be preserved.")) return;
    button.disabled = true;
    let completed = 0, failed = [];
    try {
      for (let i = 0; i < backfillDates.length; i += 10) {
        const batch = backfillDates.slice(i, i + 10);
        const response = await api("/journal/backfill", { method: "POST", body: { dates: batch } });
        completed += response.results.filter(r => r.status !== "failed").length;
        failed.push(...response.results.filter(r => r.status === "failed").map(r => r.date));
        $("#journal-backfill-status").textContent = "Processed " + Math.min(i + 10, backfillDates.length) + "/" + backfillDates.length + " days…";
      }
      $("#journal-backfill-status").textContent = completed + " journal days synchronized." +
        (failed.length ? " Failed dates: " + failed.join(", ") + ". You can retry the backfill." : "");
      button.hidden = true;
      backfillDates = [];
      toast("Journal backfill finished");

  };
  $("#add-log-type").onclick = async () => {
    try { await api("/log-types", {method:"POST",body:{name:$("#new-log-type").value}}); $("#new-log-type").value=""; await refresh(); toast("Log type created"); }
    catch(e) { handle(e); }
  };
  $("#save-typed-log").onclick = async () => {
    try {
      const minutes = Number($("#duration-minutes").value);
      if ($("#duration-minutes").value && (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440)) throw new Error("Duration must be 1–1440 minutes");
      if ($("#duration-minutes").value) {
        const end = new Date(), start = new Date(end.getTime()-minutes*60000);
        await api("/time-session", {method:"POST",body:{type:$("#log-type").value,entry:$("#typed-entry").value,start:start.toISOString(),end:end.toISOString()}});
      } else await api("/typed-log", {method:"POST",body:{type:$("#log-type").value,entry:$("#typed-entry").value}});
      $("#duration-minutes").value = "";
      $("#typed-entry").value=""; await refresh(); toast("Logged");
    } catch(e) { handle(e); }
  };
  await refresh();
};

    const meta = [target ? (days > 0 ? days + " days left, due " + shortDate(target) : days === 0 ? "Due today" : Math.abs(days) + " days past " + shortDate(target)) : "",
                  steps.length ? done + " of " + steps.length + " steps done" : ""].filter(Boolean).join(", ");
    return h`<article class="goal"><h3><a href="#note/${g.name}">${titleFrom(g.name, c)}</a></h3>
      <div class="meta">${meta || "No steps yet"}</div>
      ${raw(steps.length ? '<div class="meter" aria-hidden="true">' + steps.map(([m]) => `<i class="${m[1] !== " " ? "on" : ""}"></i>`).join("") + "</div>" : "")}
      ${raw(next ? h`<label class="next"><input type="checkbox" data-goal="${gi}" data-line="${next[1]}"><span><span class="lbl">Next:</span> ${next[0][2].replace(SCHED, "")}</span></label>` : "")}
      ${raw(progress ? h`<div class="meta" style="margin-top:6px">Last update ${shortDate(progress[1])}: ${progress[2]}</div>` : "")}</article>`;
  }).join("") + `<p style="margin-top:20px"><a class="btn quiet" href="#new-goal" style="text-decoration:none;display:inline-block">New goal</a></p>`;
  main.querySelectorAll("input[data-goal]").forEach(cb => cb.onchange = async () => {
    const g = goals[+cb.dataset.goal];

    try { await setTask(g.name, g.content, +cb.dataset.line, true); toast("Step done"); views.goals(); }
    catch (e) { cb.checked = false; cb.disabled = false; handle(e); }
  });
};

const TASK_GROUPS = [["do","Do now"],["plan","Plan"],["delegate","Handle later"],["someday","Someday / maybe"],["inbox","No priority"]];
let taskView = "agenda", taskMonth = "", taskDay = "", taskFilter = "all", taskLoad = 0;
const calendarDayLabel = date => new Intl.DateTimeFormat(undefined,{timeZone:"UTC",weekday:"long",month:"short",day:"numeric",year:"numeric"}).format(new Date(date + "T12:00:00Z"));
function taskEditSheet(task) {
  const first = task.occurrences[0];
  const date = first ? dayKey(first.at) : "", time = first ? hhmm(first.at) : "";
  openSheet(h`<form novalidate><h2 id="sheet-title">Edit task</h2><p>${task.title}</p>
    ${task.repeating ? raw('<label class="field"><span><input type="checkbox" id="keep-repeat" checked> Keep repeating schedule</span></label><p class="muted">Clear this to replace the repeat with a single date, or no date.</p>') : ""}
    <label class="field"><span>Day (optional)</span><input type="date" id="edit-day" value="${date}"></label><button type="button" class="btn quiet" id="remove-task-date">Remove date</button>
    <label class="field"><span>Time (optional)</span><input type="time" id="edit-time" value="${time}"></label>
    <p class="muted">A date without a time reminds you at 9am. Clear the day to leave this task unscheduled.</p>
    <label class="field"><span>Priority</span><select id="edit-priority">${raw(TASK_GROUPS.map(([id,label])=>h`<option value="${id}" ${id === task.priority ? "selected" : ""}>${label}</option>`).join(""))}</select></label>
    <div class="sheet-actions"><button type="button" class="btn quiet" data-close>Cancel</button><button type="submit" class="btn">Save task</button></div></form>`, el => {
    el.querySelector("[data-close]").onclick = closeSheet;
    const keep = el.querySelector("#keep-repeat");
    const toggle = () => { el.querySelector("#edit-day").disabled = Boolean(keep?.checked); el.querySelector("#edit-time").disabled = Boolean(keep?.checked); el.querySelector("#remove-task-date").disabled = Boolean(keep?.checked); };
    el.querySelector("#remove-task-date").onclick = () => { el.querySelector("#edit-day").value = ""; el.querySelector("#edit-time").value = ""; };
    if (keep) keep.onchange = toggle;
    toggle();
    el.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      if (el.querySelector("#edit-day").validity.badInput || el.querySelector("#edit-time").validity.badInput) return sheetError("Choose a valid date and time, or use Remove date.");
      const button = el.querySelector('[type="submit"]'); button.disabled = true;
      const day = el.querySelector("#edit-day").value, time = el.querySelector("#edit-time").value;
      try {
        const result = await api("/calendar/task",{method:"POST",body:{name:task.note,line:task.line,revision:task.revision,priority:el.querySelector("#edit-priority").value,...(keep?.checked ? {} : {schedule:day ? day + (time ? " " + time : "") : ""})}});

      } catch(err) { sheetError(err.message); button.disabled = false; }
