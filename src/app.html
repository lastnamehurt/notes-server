views.reminders = async () => {
  const load = ++taskLoad;
  const today = dayKey(Date.now());
  if (!taskMonth) taskMonth = today.slice(0,7);
  if (!taskDay) taskDay = today;
  const from = taskMonth + "-01", next = new Date(from + "T12:00:00Z"); next.setUTCMonth(next.getUTCMonth()+1);
  const to = next.toISOString().slice(0,10);
  const data = await api("/calendar?from=" + from + "&to=" + to);
  if (load !== taskLoad || location.hash !== "#reminders") return;
  const tasks = data.tasks.filter(t => taskFilter === "all" || t.priority === taskFilter);
  const now = Date.now(), rows = [], overdue = [], unscheduled = [];
  tasks.forEach(task => {
    if (!task.occurrences.length && !task.schedule) unscheduled.push({task});
    task.occurrences.forEach(r => {
      const row = {task,at:r.at,date:dayKey(r.at)};
      if (!task.repeating && r.at < now) overdue.push(row);
      if (row.date >= from && row.date < to && (!task.repeating || row.date >= today)) rows.push(row);
    });
  });
  rows.sort((a,b)=>a.at-b.at || TASK_GROUPS.findIndex(g=>g[0]===a.task.priority)-TASK_GROUPS.findIndex(g=>g[0]===b.task.priority));
  overdue.sort((a,b)=>a.at-b.at);
  const entries = [];
  const rowHtml = row => {
    const index = entries.push(row)-1, t = row.task;
    return h`<div class="unified-task ${row.at ? "rem" : ""}"><button type="button" class="task-done task-check" data-entry="${index}" aria-label="${t.repeating ? "Complete occurrence of" : "Mark done:"} ${t.title}">○</button><div class="task-main"><a class="task-title" href="#note/${t.note}">${t.title}</a><div class="task-meta">${row.at ? raw(h`<span class="when">${calendarDayLabel(row.date)} · ${fmt12(hhmm(row.at))}${t.repeating ? " · Repeats" : ""}</span>`) : ""}<span class="pri-badge">${TASK_GROUPS.find(g=>g[0]===t.priority)[1]}</span><span class="task-from">${titleFrom(t.note)}</span></div></div><button type="button" class="btn quiet task-edit" data-entry="${index}" aria-label="Edit ${t.title}">Edit</button></div>`;
  };
  const section = (label, list, empty) => h`<section class="step"><h3>${label} · ${list.length}</h3>${raw(list.length ? list.map(rowHtml).join("") : h`<p class="muted">${empty}</p>`)}</section>`;
  const monthTitle = new Intl.DateTimeFormat(undefined,{timeZone:"UTC",month:"long",year:"numeric"}).format(new Date(from+"T12:00:00Z"));
  let html = h`<div class="bar"><h2>Tasks</h2><button class="btn" id="newtask">+ Add task</button></div><div class="calendar-tools"><div class="choice" role="group" aria-label="Task view"><button data-task-view="agenda" aria-pressed="${taskView === "agenda"}">Agenda</button><button data-task-view="month" aria-pressed="${taskView === "month"}">Month</button></div><label>Priority <select id="task-filter"><option value="all">All priorities</option>${raw(TASK_GROUPS.map(([id,label])=>h`<option value="${id}" ${taskFilter === id ? "selected" : ""}>${label}</option>`).join(""))}</select></label><button class="btn quiet" id="task-refresh">Refresh</button></div><div class="calendar-nav"><button class="btn quiet" id="task-prev" aria-label="Previous month">←</button><h3 aria-live="polite">${monthTitle}</h3><button class="btn quiet" id="task-next" aria-label="Next month">→</button><button class="btn quiet" id="task-today">Today</button></div><p class="muted">Dates and times in ${data.timeZone}.</p>`;
  if (taskView === "month") {
    const start = new Date(from+"T12:00:00Z").getUTCDay();
    const last = new Date(to+"T12:00:00Z"); last.setUTCDate(last.getUTCDate()-1);
    const cells = Array(start).fill('<td></td>');
    for (let n=1;n<=last.getUTCDate();n++) {
      const date = taskMonth + "-" + String(n).padStart(2,"0"), count = rows.filter(r=>r.date===date).length;
      cells.push(h`<td><button class="calendar-day" data-day="${date}" aria-pressed="${taskDay===date}" ${date===today ? raw('aria-current="date"') : ""} aria-label="${calendarDayLabel(date)}, ${count} ${count === 1 ? "task" : "tasks"}"><span>${n}</span><small>${count ? count + (count===1 ? " task" : " tasks") : ""}</small></button></td>`);
    }
    while (cells.length % 7) cells.push('<td></td>');
    html += '<table class="task-calendar"><caption class="sr">'+esc(monthTitle)+'</caption><thead><tr>'+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map(d=>h`<th scope="col"><abbr title="${d}">${d.slice(0,2)}</abbr></th>`).join("")+'</tr></thead><tbody>';
    for (let i=0;i<cells.length;i+=7) html += '<tr>'+cells.slice(i,i+7).join("")+'</tr>';
    html += '</tbody></table>';
    html += h`<div class="bar"><h3>${calendarDayLabel(taskDay)}</h3><button class="btn quiet" id="add-day">+ Add for this day</button></div>`;
    html += section("Selected day",rows.filter(r=>r.date===taskDay),"No tasks for this day.");
  } else {
    const agenda = rows.filter(r=>r.task.repeating || r.at >= now);
    html += '<section class="step"><h3>Scheduled tasks · '+agenda.length+'</h3>';
    if (!agenda.length) html += '<p class="muted">No upcoming tasks in this month.</p>';
    for (const date of [...new Set(agenda.map(r=>r.date))]) html += h`<div class="task-group"><h4>${calendarDayLabel(date)}</h4>${raw(agenda.filter(r=>r.date===date).map(rowHtml).join(""))}</div>`;
    html += '</section>';
  }
  html += section("Overdue",overdue,"No overdue tasks.");
  const ordered = TASK_GROUPS.flatMap(([id])=>unscheduled.filter(r=>r.task.priority===id));
  html += section("Unscheduled",ordered,"No unscheduled tasks.");
  main.innerHTML = html;
  const refresh = async () => {
    const active = document.activeElement, id = active?.id, day = active?.dataset?.day, view = active?.dataset?.taskView;
    try {
      await views.reminders();
      const target = id ? document.getElementById(id) : day ? main.querySelector('[data-day="' + day + '"]') : view ? main.querySelector('[data-task-view="' + view + '"]') : null;
      target?.focus();
    } catch(err) { handle(err); }
  };
  $("#newtask").onclick = () => taskSheet({onSaved:refresh});
  $("#task-refresh").onclick = refresh;
  main.querySelectorAll("[data-task-view]").forEach(b=>b.onclick=()=>{taskView=b.dataset.taskView;refresh();});
  $("#task-filter").onchange = e=>{taskFilter=e.target.value;refresh();};
  const move = delta => { const d = new Date(from+"T12:00:00Z"); d.setUTCMonth(d.getUTCMonth()+delta); taskMonth=d.toISOString().slice(0,7);taskDay=taskMonth+"-01";refresh(); };
  $("#task-prev").onclick=()=>move(-1); $("#task-next").onclick=()=>move(1);
  $("#task-today").onclick=()=>{taskMonth=today.slice(0,7);taskDay=today;refresh();};
  main.querySelectorAll(".calendar-day").forEach(b=>b.onclick=()=>{taskDay=b.dataset.day;refresh();});
  if ($("#add-day")) $("#add-day").onclick=()=>taskSheet({when:"pick",date:taskDay,onSaved:refresh});
  main.querySelectorAll(".task-edit").forEach(b=>b.onclick=()=>taskEditSheet(entries[+b.dataset.entry].task));
  main.querySelectorAll(".task-done").forEach(b=>b.onclick=async()=>{
    b.disabled=true; const {task,at} = entries[+b.dataset.entry];
    try { const result=await api("/calendar/task",{method:"POST",body:{name:task.note,line:task.line,revision:task.revision,done:true,at}}); await views.reminders();toast(result.warning || (task.repeating ? "Occurrence completed" : "Task completed")); }
    catch(err){handle(err);b.disabled=false;}
  });
};
/* ---------- Note: read, tap to edit ---------- */
async function editor(name, category) {
  const isNew = !name;
  const folder = isNew ? (category || "inbox") : name.split("/")[0];
  const backTo = folder === "goals" ? "#goals" : "#notes";
  const backLabel = folder === "goals" ? "Goals" : "Notes";
  let content = "";
  let revision;
  if (!isNew) {
    main.innerHTML = '<p class="empty">Opening note…</p>';
    const loaded = await api("/note?name=" + encodeURIComponent(name));
    content = loaded.content;
    revision = loaded.sha;
  }

  const read = () => {
    clearDirty();
    const isGoal = folder === "goals";
    main.innerHTML = h`<div class="edbar"><div class="left"><a class="link back" href="${backTo}">${backLabel}</a></div><div class="right"><button class="btn small" id="edit">Edit</button></div></div>
      <p class="where">In ${folderName(folder)}${dateFrom(name) ? ", created " + dateFrom(name) : ""}</p>
      ${raw(`<div class="doc" id="doc" title="Tap to edit">${content.trim() ? render(content) : '<p class="empty">This note is empty. Tap to write.</p>'}</div>`)}
      <div class="actions"><button class="btn quiet" id="addrem">Add task</button>${raw(!isGoal ? '<button class="btn quiet" id="promote-goal">Promote to goal</button>' : "")}${raw(isGoal ? '<button class="btn quiet" id="addupd">Add update</button>' : "")}</div>
      <button class="danger-link" id="del">Delete note</button>`;
    $("#edit").onclick = () => edit();
    $("#doc").onclick = e => { if (!e.target.closest("input, a, label")) edit(); };
    main.querySelectorAll("#doc input[data-line]").forEach(cb => cb.onchange = async () => {
      cb.disabled = true;
      try { content = await setTask(name, content, +cb.dataset.line, cb.checked, revision); revision = (await api("/note?name=" + encodeURIComponent(name))).sha; toast(cb.checked ? "Checked off" : "Unchecked"); }
      catch (e) { handle(e); }
      read();
    });
    if (!isGoal) $("#promote-goal").onclick = async () => {
      if (!confirm("Create a goal from this note? The original stays in Notes.")) return;
      const parts = splitTitle(content);
      const title = parts.title || titleFrom(name) || "New goal";
      const goalContent = "# " + title + "\n\nWhy: " + (parts.body.trim().split("\n").find(Boolean) || "Add your motivation") + "\n\nSource note: " + name + "\n\n## Next steps\n\n## Progress\n";
      const button = $("#promote-goal"); button.disabled = true;
      try { const result = await api("/note", {method:"POST",body:{content:goalContent,category:"goals"}}); nextToast = "Goal created; original note preserved"; location.hash = "#note/" + result.name; }
      catch(err) { handle(err); button.disabled = false; }
    };
    $("#addrem").onclick = () => taskSheet({ note: name, onSaved: async () => { const loaded = await api("/note?name=" + encodeURIComponent(name)); content = loaded.content; revision = loaded.sha; read(); } });
    if (isGoal) $("#addupd").onclick = () => progressSheet(name, content, next => { content = next; revision = undefined; read(); });
    $("#del").onclick = async () => {
      if (!confirm("Delete this note? Any reminders in it stop too.")) return;
      try { await api("/note?name=" + encodeURIComponent(name), { method: "DELETE" }); nextToast = "Note deleted"; location.hash = backTo; }
      catch (e) { handle(e); }
    };
  };

  const edit = () => {
    const { title, body } = splitTitle(content);
    const cats = cfg.categories.filter(c => c !== "journal");
    main.innerHTML = h`<form id="edform" novalidate>
      <div class="edbar"><div class="left"><button type="button" class="link" id="cancel">Cancel</button></div><div class="right"><button class="btn small" id="save" type="submit">Save</button></div></div>
      ${raw(isNew ? h`<label class="field"><span>Folder</span><select id="cat">${raw(cats.map(c => h`<option value="${c}" ${c === folder ? "selected" : ""}>${folderName(c)}</option>`).join(""))}</select></label>` : "")}
      <label for="title" style="position:absolute;left:-9999px">Title</label><input class="title-in" id="title" value="${title}" placeholder="Title">
      <label for="body" style="position:absolute;left:-9999px">Note</label><textarea class="body-in" id="body" placeholder="Write anything. Start a line with - [ ] to make a checkbox.">${body}</textarea>
      <p class="hint">To add a task with a date or reminder, save and tap Add task.</p>
    </form>`;
    const ta = $("#body");
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 4, window.innerHeight * 0.4) + "px"; };
    ta.oninput = grow; grow();
    const original = joinTitle(title, body);
    const current = () => joinTitle($("#title").value, $("#body").value);
    isDirty = () => !!$("#edform") && current() !== original;
    (isNew || !title ? $("#title") : ta).focus();
    $("#cancel").onclick = () => {
      if (isDirty() && !confirm("Discard your changes?")) return;
      clearDirty();
      if (isNew) location.hash = backTo; else read();
    };
    $("#edform").onsubmit = async e => {
      e.preventDefault();
      const next = current();
      if (!$("#title").value.trim() && !$("#body").value.trim()) return toast("Write something before saving");
      $("#save").disabled = true;
      try {
        if (isNew) {
          const res = await api("/note", { method: "POST", body: { content: next, category: $("#cat").value } });
          clearDirty(); allNotes = null; nextToast = savedMessage(res, "Saved"); location.hash = "#note/" + res.name;
        } else {
          const res = await api("/note", { method: "PUT", body: { name, content: next, sha: revision } });
          const previous = content;
          content = next; revision = (await api("/note?name=" + encodeURIComponent(name))).sha; clearDirty(); read();
          offerUndo(savedMessage(res, "Saved"), async () => { await undoNoteChange(name, previous, next); await editor(name); });
        }
      } catch (err) { handle(err); $("#save").disabled = false; }
    };
  };

  isNew ? edit() : read();
}

/** "just now", "5 min ago", "3 hours ago", "2 days ago". */
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + (Math.round(m / 60) === 1 ? " hour ago" : " hours ago") : Math.round(m / 1440) + (Math.round(m / 1440) === 1 ? " day ago" : " days ago"); };
const SHORTCUT_GUIDE = "https://github.com/lastnamehurt/notes-server/blob/main/docs/apple-reminders-shortcuts.md";

/** Links inside Settings that scroll to another section (the router would otherwise jump to the top). */
function wireJumps(root) {
  root.querySelectorAll("[data-jump]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const to = document.getElementById(a.dataset.jump);
    if (to?.tagName === "DETAILS") to.open = true;

  });

/*
 * Settings opens with the everyday settings (name, notes, time zone, phone reminders, assistants) and folds
 * the rest into one-line rows that expand in place, so the page reads as a short list.
 */
const SETTINGS_FOLDS = [
  ["briefings", "A push each morning and evening with what's due"],
  ["shortcuts", "The address and the secret for your iPhone Shortcuts"],
  ["apple-reminders", "See and check off tasks in the Reminders app"],
  ["calendar", "Show events here, or tasks in your calendar app"],
  ["updates", "Your Daybook version"],
  ["diagnostics", "Make sure that notes, sign-in and notifications work"]
];
function foldSettings(open) {
  for (const [id, hint] of SETTINGS_FOLDS) {
    const section = document.getElementById(id);
    if (!section || section.tagName !== "SECTION") continue;
    const fold = document.createElement("details");
    fold.className = "step fold"; fold.id = id;
    const summary = document.createElement("summary");
    const heading = section.querySelector("h3");
    const title = document.createElement("span"); title.className = "fold-title"; title.textContent = heading ? heading.textContent : id;
    const sub = document.createElement("span"); sub.className = "fold-hint"; sub.textContent = hint;
    summary.append(title, sub);
    heading?.remove();
    fold.append(summary, ...section.childNodes);
    section.replaceWith(fold);
    if (id === open) fold.open = true;
  }
}

/**
 * Settings → Shortcuts: the one place for the iPhone Shortcuts' addresses and their shared secret.
 * The secret stays hidden until Show or Copy asks the server for it.
 */
async function wireShortcuts() {
  const box = $("#shortcuts-body");
  if (!box) return;
  let st;
  try { st = await api("/shortcuts"); } catch (e) { if (box.isConnected) box.innerHTML = h`<p class="err">${e.message}</p>`; return; }
  if (!box.isConnected) return;
  let secret = null;
  const reveal = async () => secret ??= (await api("/shortcuts/secret")).token;
  const secretBlock = !st.hasSecret
    ? h`<p class="muted">You do not have a secret yet. Make one before you set up a Shortcut.</p><button class="btn" type="button" id="sc-new">Make my Shortcut secret</button>`
    : h`<div class="copyrow"><code id="sc-secret" aria-label="Shortcut secret, hidden">••••••••••</code>
          <button class="btn quiet" type="button" id="sc-show">Show</button><button class="btn quiet" type="button" id="sc-copy">Copy</button></div>
        ${raw(st.fromDeploy
          ? '<p class="muted">This secret is set in your Cloudflare account (SHORTCUTS_TOKEN). To change it, change it in Cloudflare.</p>'
          : '<details class="more"><summary>Make a new secret</summary><p class="muted">Do this only if someone else saw your secret. The old secret stops working immediately. Then paste the new secret into each Daybook Shortcut.</p><button class="btn quiet" type="button" id="sc-new">Make a new secret</button></details>')}`;
  const row = (id, title, url, extra) => h`<div class="sc-row"><h4>${title}</h4>
      <div class="copyrow"><code>${url}</code><button class="btn quiet" type="button" id="${id}">Copy</button></div>${raw(extra)}</div>`;
  box.innerHTML = h`<div class="sc-row"><h4>Secret</h4>${raw(secretBlock)}</div>`
    + row("sc-sync-copy", "Reminders sync", st.syncUrl,
        h`<p class="muted">Use this address in the <b>Sync Daybook</b> Shortcut. <a href="#apple-reminders" data-jump="apple-reminders">Setup steps</a> · <a href="${SHORTCUT_GUIDE}" target="_blank" rel="noopener">Guide ↗</a></p>`)
    + row("sc-signal-copy", "Tap to pay", st.signalUrl,
        h`<p class="muted">Use this address in the <b>Daybook Tap</b> Shortcut. It counts your Apple Pay payments in stores. If you have a Mac, <a href="${TAP_SCRIPT}" target="_blank" rel="noopener">make-tap-shortcut.sh</a> makes this Shortcut for you. <a href="${TAP_GUIDE}" target="_blank" rel="noopener">Guide ↗</a></p>
        <p class="muted">The errand reminder for when you park (optional) uses the same address.</p>`)
    + h`<p class="muted">To set spending targets, cards to leave out and kinds of place, go to <a href="#spending">Today → Spending</a>.</p>`;
  const $b = sel => box.querySelector(sel);
  $b("#sc-sync-copy").onclick = e => copy(st.syncUrl, e.target);
  $b("#sc-signal-copy").onclick = e => copy(st.signalUrl, e.target);
  if ($b("#sc-show")) $b("#sc-show").onclick = async e => {
    const code = $b("#sc-secret");
    if (e.target.textContent === "Hide") { code.textContent = "••••••••••"; code.setAttribute("aria-label", "Shortcut secret, hidden"); e.target.textContent = "Show"; return; }
    try { code.textContent = await reveal(); code.removeAttribute("aria-label"); e.target.textContent = "Hide"; } catch (err) { handle(err); }
  };
  if ($b("#sc-copy")) $b("#sc-copy").onclick = async e => { try { copy(await reveal(), e.target); } catch (err) { handle(err); } };
  if ($b("#sc-new")) $b("#sc-new").onclick = async e => {
    if (st.hasSecret && !confirm("Make a new secret? Your Daybook Shortcuts stop working until you paste the new secret into each one.")) return;
    e.target.disabled = true;
    try { await api("/apple-sync/token", { method: "POST", body: {} }); toast("Your new secret is ready. Tap Copy, then paste it into your Shortcuts."); await wireShortcuts(); }
    catch (err) { handle(err); e.target.disabled = false; }
  };
  wireJumps(box);
}

/** Settings → Apple Reminders: sync status, setup steps and who alerts. The address and secret live in Shortcuts. */
async function wireAppleReminders() {
  const box = $("#apple-status");
  if (!box) return;
  let st;
  try { st = await api("/apple-sync"); } catch (e) { if (box.isConnected) box.innerHTML = h`<p class="err">${e.message}</p>`; return; }
  // Settings may have been redrawn while this loaded; only fill the panel that's still on screen.
  if (!box.isConnected) return;
  const $b = sel => box.querySelector(sel);
  const synced = st.lastSyncAt !== null;
  const fresh = synced && Date.now() - st.lastSyncAt < st.freshForMs;
  const status = !synced
    ? h`<p class="apple-state"><b>Not set up.</b> Setup takes about 10 minutes on your iPhone. You do it one time.</p>`
    : fresh
      ? h`<p class="apple-state ok"><b>Synced ${ago(st.lastSyncAt)}</b> · ${st.mirrored} ${st.mirrored === 1 ? "task" : "tasks"} in Reminders</p>`
      : h`<p class="apple-state warn"><b>Last synced ${ago(st.lastSyncAt)}.</b> Until the Shortcut runs again, Daybook sends its own notifications.</p>`;
  const steps = h`<ol class="apple-steps">
      <li>In the <b>Reminders</b> app, make a list. Name it <b>Daybook</b>.</li>
      <li>In <a href="#shortcuts" data-jump="shortcuts">Shortcuts</a> above, copy the <b>Reminders sync</b> address and the secret.</li>
      <li>In the <b>Shortcuts</b> app, make a Shortcut named <b>Sync Daybook</b>. Use the address and the secret. <a href="${SHORTCUT_GUIDE}" target="_blank" rel="noopener">Step-by-step guide ↗</a></li>
      <li>In the Shortcuts app, go to <b>Automation</b>. Make the Shortcut run when you close the Reminders app. Make it also run at a few times each day, for example 7am, 12pm and 6pm. Select <b>Run Immediately</b>.</li>
    </ol>`;
  box.innerHTML = status
    + (synced ? h`<p><a class="btn a-btn" href="${RUN_SHORTCUT}">Sync now</a></p>` : "")
    + (synced ? h`<details class="more"><summary>Shortcut setup</summary>${raw(steps)}</details>` : steps)
    + h`<fieldset class="apple-alerts"><legend>Alerts for tasks in Reminders</legend>
        <label><input type="radio" name="task-alerts" value="reminders" ${st.taskAlerts === "reminders" ? "checked" : ""}> <span><b>Reminders only</b> <span class="muted">(recommended)</span></span></label>
        <label><input type="radio" name="task-alerts" value="both" ${st.taskAlerts === "both" ? "checked" : ""}> <span><b>Reminders and Daybook notifications</b></span></label>
        <p class="muted">If the Shortcut does not sync for 36 hours, Daybook sends its own notifications again. Tasks without a date or a priority stay only in Daybook.</p>
      </fieldset>`;
  wireJumps(box);
  box.querySelectorAll('input[name="task-alerts"]').forEach(input => input.onchange = async () => {
    try { await api("/apple-sync/alerts", { method: "POST", body: { taskAlerts: input.value } }); toast(input.value === "reminders" ? "Reminders alerts you for synced tasks" : "You get alerts from Reminders and Daybook"); }
    catch (err) { handle(err); }
  });
}

/** Settings → Calendar: make the feed address, subscribe to a calendar, and list its next events. */
async function wireCalendar() {
  const showEvents = async () => {
    const box = $("#cal-events");
    if (!box) return;
    try {
      const res = await api("/calendar/upcoming");
      if (!box.isConnected) return;
      if (!res.connected) { box.innerHTML = h`<p class="muted">No calendar shown yet.</p>`; return; }
      const fmt = e => e.allDay ? new Date(e.start).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" })
        : new Date(e.start).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: cfg.timeZone });
      box.innerHTML = res.events.length
        ? h`<h4>Next 14 days</h4><ul class="assistant-list">${raw(res.events.slice(0, 8).map(e => h`<li class="assistant-row"><span><b>${e.title}</b><span class="muted"> · ${fmt(e)}</span></span></li>`).join(""))}</ul>`
        : h`<p class="muted">No events in the next 14 days.</p>`;
    } catch (e) { if (box.isConnected) box.innerHTML = h`<p class="err">${e.message}</p>`; }
  };
  $("#cal-make").onclick = async () => {
    if (!confirm("Make a new address? The old one stops working.")) return;
    try { const { url } = await api("/calendar/token", { method: "POST", body: {} }); $("#cal-url").innerHTML = h`<div class="copyrow"><code>${url}</code><button class="btn quiet" id="cal-copy" type="button">Copy</button></div>`; $("#cal-copy").onclick = e => copy(url, e.target); }
    catch (e) { toast(e.message); }
  };
  $("#cal-save").onclick = async () => {
    // Apple's share links start with webcal:// and are https underneath.
    $("#cal-feed").value = $("#cal-feed").value.trim().replace(/^webcals?:\/\//i, "https://");
    try { await api("/calendar/feed", { method: "POST", body: { url: $("#cal-feed").value } }); toast($("#cal-feed").value.trim() ? "Calendar saved" : "Calendar removed"); showEvents(); }
    catch (e) { toast(e.message); }
  };
  // The two "I want…" choices jump to their part (buttons, since #links would change the page).
  showEvents();
}

  const drawRepos = (repos) => {

  // Connect GitHub: show a code, she approves it on GitHub, and this page notices on its own.

  const ghFailed = msg => {
    ghActive = false; clearTimeout(ghTimer);

    $("#gh-start").onclick = ghStart;
  };
  const ghPoll = async () => {
    if (!ghActive || ghBusy) return;
    ghBusy = true; clearTimeout(ghTimer);
    try {
      const r = await api("/setup/github/poll", { method: "POST", body: { timezone: $("#tz").value, move: ghMove } });
      if (r.state === "done" && ghMove) {
        ghActive = false; clearTimeout(ghTimer);

      else if (r.state === "failed") ghFailed(r.message);
      else { if (r.interval) ghInterval = r.interval; ghTimer = setTimeout(ghPoll, ghInterval * 1000); }
    } catch (e) { if (e instanceof Locked) { ghBusy = false; return showLock(); } ghFailed(e.message); }
    ghBusy = false;
  };
  async function ghStart() {
    const b = $("#gh-start"); if (b) { b.disabled = true; b.textContent = "Starting…"; }
    try {
      const f = await api("/setup/github/start", { method: "POST" });
      ghInterval = f.interval;
      $("#gh-flow").innerHTML = h`<p>Your code:</p>
        <div class="copyrow"><code class="ghcode" id="gh-code">${f.userCode}</code></div>

      $("#gh-open").addEventListener("click", () => { navigator.clipboard && navigator.clipboard.writeText(f.userCode).catch(() => {}); });
      ghActive = true; ghTimer = setTimeout(ghPoll, ghInterval * 1000);
    } catch (e) { if (e instanceof Locked) return showLock(); ghFailed(e.message); }
  }
  if (connect && $("#gh-start")) {
    $("#gh-start").onclick = ghStart;
    // Coming back from GitHub: check straight away instead of waiting for the next poll.
    const onBack = () => { if (!document.hidden && ghActive && $("#gh-flow")) { clearTimeout(ghTimer); setTimeout(ghPoll, 300); } };

  renderPush($("#push-box"));

  };


  $("#save").onclick = async () => {
    const b = $("#save"); b.disabled = true; b.textContent = "Saving…"; $("#saveerr").textContent = "";
    try {
      // ntfy/Pushover (older options) only appear for setups that use them; unticking stops them.

      if ($("#pname") && $("#pname").value.trim() !== (cfg.name || "")) await api("/profile", { method: "POST", body: { name: $("#pname").value } });
      if (chosenStorage === "app") await api("/setup", { method: "POST", body: { storage: "app", timezone: $("#tz").value, ...push } });
      else {
      if (!chosenRepo) throw new Error(connect ? "Connect GitHub first." : "Check your key and pick where to save notes.");
      await api("/setup", { method: "POST", body: { storage: "github",
        token: $("#tok") ? $("#tok").value.trim() : "", repo: chosenRepo, timezone: $("#tz").value, ...push } });
      }

      showDone(location.origin + "/mcp");
    } catch (e) { if (e instanceof Locked) return showLock(); $("#saveerr").textContent = e.message; }
    b.disabled = false; b.textContent = "Save and finish";
  };
};

// "Run checks" in Settings: delegated from the persistent main container, wired once at load,
// so the button works however Settings was reached and survives re-renders.
main.addEventListener("click", async event => {
  const button = event.target.closest("#run-diagnostics");
  if (!button || !main.contains(button) || button.disabled) return;
  const output = main.querySelector("#diagnostics-results");
  if (!output) return;
  button.disabled = true;
  button.textContent = "Checking…";
  output.textContent = "Checking your system…";
  try {
    const report = await api("/diagnostics");
    if (!Array.isArray(report.checks)) throw new Error("Unexpected diagnostics response");
    output.innerHTML = report.checks.map(item =>
      h`<p><b>${item.status === "pass" ? "✓" : item.status === "fail" ? "✕" : "!"} ${item.id}</b>: ${item.message}</p>`).join("") || "<p>No checks returned.</p>";
  } catch (error) {
    output.textContent = "Diagnostics failed: " + (error.message || String(error));
  } finally {
    button.disabled = false;
    button.textContent = "Run checks";
  }
});


/* ---------- Daily briefings (Settings) ---------- */
const BRIEF_LABEL = { morning: "Morning briefing", evening: "Evening wrap-up" };
function briefWhen(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return d.toLocaleDateString(undefined, { weekday: "short" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
async function loadBriefings() {
  const body = $("#brief-body");
  if (!body) return;
  let state;
  try { state = await api("/briefings"); } catch (e) { body.innerHTML = h`<p class="muted">Couldn't load briefings: ${e.message}</p>`; return; }
  if (!body.isConnected) return; // left Settings while loading
  const row = kind => {
    const k = state.settings[kind], st = state.status[kind], next = state.next[kind];
    const last = st ? (st.result === "sent" ? "Last sent " + briefWhen(st.at) : (st.result === "skipped" ? "Skipped " : "Failed ") + briefWhen(st.at) + (st.detail ? ": " + st.detail : "")) : "";
    return h`<div class="brief-row">
      <label class="brief-toggle"><input type="checkbox" id="brief-${kind}-on" ${k.enabled ? "checked" : ""}> ${BRIEF_LABEL[kind]}</label>
      <input type="time" id="brief-${kind}-time" value="${k.time}" aria-label="${BRIEF_LABEL[kind]} time">
      <p class="muted brief-status">${k.enabled && next ? "Next: " + briefWhen(next) : "Off"}${last ? " · " + last : ""}</p>
      <div class="brief-actions"><button class="btn quiet" type="button" data-brief-preview="${kind}">Preview</button><button class="btn quiet" type="button" data-brief-test="${kind}">Send test</button></div>
    </div>`;
  };
  body.innerHTML = row("morning") + row("evening") + h`
    <label for="brief-preview">On the lock screen</label>
    <select id="brief-preview"><option value="full" ${state.settings.preview === "full" ? "selected" : ""}>Show task names</option><option value="counts" ${state.settings.preview === "counts" ? "selected" : ""}>Show counts only</option></select>
    <button class="btn" id="brief-save" type="button">Save briefings</button>
    ${raw(cfg.push ? "" : '<p class="hint">Phone notifications are off, so briefings won\'t be sent until you turn them on above.</p>')}
    <pre id="brief-out" class="brief-out" hidden></pre>`;
  $("#brief-save").onclick = async e => {
    const b = e.target; b.disabled = true;
    const settings = { preview: $("#brief-preview").value };
    for (const kind of ["morning", "evening"]) settings[kind] = { enabled: $(`#brief-${kind}-on`).checked, time: $(`#brief-${kind}-time`).value || state.settings[kind].time };
    try { await api("/briefings", { method: "PUT", body: { settings, revision: state.settings.revision } }); toast("Briefings saved"); await loadBriefings(); }
    catch (err) { toast(err.message); b.disabled = false; }
  };
  body.querySelectorAll("[data-brief-preview],[data-brief-test]").forEach(b => b.onclick = async () => {
    const test = b.dataset.briefTest, kind = test || b.dataset.briefPreview;
    b.disabled = true;
    try {
      const out = await api(test ? "/briefings/test" : "/briefings/preview", { method: "POST", body: { kind } });
      const pre = $("#brief-out");
      pre.hidden = false;
      pre.textContent = out.title + "\n" + out.message;
      if (test) toast("Sent. Check your phone");
    } catch (err) { toast(err.message); }
    b.disabled = false;
  });
}

/* ---------- Lock ---------- */
async function showLock(message) {
  closeSheet();
  $("#tabs").hidden = true; $("#subtabs").hidden = true; $("#settingsTab").hidden = true; $("#composer").hidden = true; $("#lockbtn").hidden = true;
  const info = await fetch("/app/login/info").then(r => r.json()).catch(() => ({ method: "password" }));
  const err = raw(message ? h`<p class="err" role="alert">${message}</p>` : "");
  // The password works everywhere (it's also what Claude asks for). Once notes are set up, GitHub is offered too.
  const github = info.method === "github";

async function startGithubLogin() {

async function pollGithubLogin(deviceCode, interval) {
  const res = await fetch("/app/login/github/poll", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceCode }) });
  const body = await res.json().catch(() => ({}));
  if (body.state === "pending") return setTimeout(() => pollGithubLogin(deviceCode, body.interval || interval), interval * 1000);
  if (body.state === "done") { await start(); return route(); }
  showLock(body.message || body.error || "Couldn't sign in with GitHub. Try again.");

async function renderSignalSettings() {

  description.textContent = "These are off until you turn them on. When you pay with Apple Pay in a store, a Shortcut sends Daybook the amount, the card name and the kind of place. It never sends the store's name or your location.";

  const form = document.createElement("form");
  const row = (label, input) => {
    const wrap = document.createElement("label"); wrap.style.display = "block"; wrap.style.margin = "12px 0"; wrap.style.minHeight = "44px";

  };
  const make = (type, name, value) => { const i = document.createElement("input"); i.type = type; i.name = name;
    if (type === "checkbox") i.checked = value; else i.value = value ?? ""; return i; };
  const enabled = row("Count my Apple Pay payments", make("checkbox", "signal-enabled", p.enabled));
  const hide = row("Do not show amounts on the lock screen", make("checkbox", "signal-hide", settings.hideAmounts));
  const parked = row("Remind me of errands when I park (tag a task @at:grocery, for example)", make("checkbox", "signal-parked", settings.parked.enabled));
  const amount = (name, label, value) => { const i = row(label, make("number", name, value)); i.min = "0"; i.step = "0.01"; i.placeholder = "Off"; return i; };
  const big = amount("signal-big", "Ask “Was this planned?” when one payment is at least ($)", p.bigPurchase);
  const daily = amount("signal-daily", "Daily spending target in $ (optional)", p.dailyTarget);
  const weekly = amount("signal-weekly", "Weekly spending target in $ (optional)", p.weeklyTarget);
  const drinks = row("Most bar payments in one week (optional)", make("number", "signal-drinks", p.drinkGoalPerWeek));
  drinks.min = "0"; drinks.step = "1"; drinks.placeholder = "Off";
  const cards = row("Cards to leave out, for example a work card (put a comma between names)", make("text", "signal-cards", p.ignoredCards.join(", ")));
  const cats = document.createElement("textarea"); cats.name = "signal-categories"; cats.rows = 4; cats.style.width = "100%";

    event.preventDefault(); save.disabled = true;

      const categories = {};
      for (const line of cats.value.split("\n").map(l => l.trim()).filter(Boolean)) {
        const m = /^([^=]+)=\s*(drink|food|none)\s*$/i.exec(line);
        if (!m) throw new Error("Daybook cannot read “" + line + "”. Write it like this: coffee = food");
        categories[m[1].trim().toLowerCase().replace(/&/g, " ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")] = m[2].toLowerCase();
      }
      const goal = num(drinks);
      await api("/signals/settings", { method: "PUT", body: { hideAmounts: hide.checked, parked: { enabled: parked.checked }, payment: {
        enabled: enabled.checked, bigPurchase: num(big), dailyTarget: num(daily), weeklyTarget: num(weekly),
        drinkGoalPerWeek: goal === null ? null : Math.round(goal),
        ignoredCards: cards.value.split(",").map(c => c.trim()).filter(Boolean), categories } } });

    try { const r = await api("/signals/erase", { method: "POST", body: {} }); toast(`Deleted ${r.deleted} payments`); route(); }
    catch (error) { toast(error.message); }
  };

  return section;
}

/* ---------- Spending (#147): taps from the Wallet Shortcut ---------- */
const SIGNAL_HELP = {
  "wrong-secret": "To fix: open the Shortcut. In Get Contents of URL, find the Authorization header. Its value must be Bearer, a space, then your secret from Settings → Shortcuts.",
  "not-set-up": "To fix: make your secret in Settings → Shortcuts. Then paste it into the Shortcut.",
  "invalid": "To fix: open the Shortcut. In Get Contents of URL, set Request Body to JSON. Make sure kind is payment and amount is Shortcut Input → Amount.",
  "off": "To fix: below, select Count my Apple Pay payments. Then tap Save."
};
async function renderSpending() {
  const data = await api("/signals/today");
  const money = n => "$" + Number(n).toFixed(2);
  const fmtTime = at => new Intl.DateTimeFormat(undefined, { timeZone: data.timeZone, hour: "numeric", minute: "2-digit" }).format(new Date(at));
  const fmtWhen = at => new Intl.DateTimeFormat(undefined, { timeZone: data.timeZone, weekday: "short", hour: "numeric", minute: "2-digit" }).format(new Date(at));
  const s = data.summary;
  const last = data.last;
  const ok = last && (last.outcome === "recorded" || last.outcome === "duplicate");
  // All good: one quiet line. Something wrong (or nothing yet): the full box with what to fix.
  const status = ok
    ? h`<p class="spend-ok">Shortcut works · last payment ${fmtWhen(last.at)}</p>`
    : h`<div class="today-focus-card"><div class="today-focus-heading"><h3>Shortcut status</h3></div>${raw(!last
        ? h`<p class="muted">No payment has come in yet. Pay with Apple Pay in a store. Then look here to see if Daybook got it.</p>`
        : h`<p class="apple-state warn"><b>The payment at ${fmtWhen(last.at)} did not count.</b> ${last.detail}</p>
            <p class="muted">${SIGNAL_HELP[last.outcome] || ""}${last.fields && last.fields.length ? " Fields received: " + last.fields.join(", ") + "." : ""}</p>`)}</div>`;
  const taps = data.taps.length
    ? '<ul class="today-focus-list">' + data.taps.map(t => h`<li class="today-focus-row"><div class="today-focus-content"><b>${money(t.amount)}</b> <span class="muted">${t.category === "other" ? "" : t.category.replace(/-/g, " ") + " · "}${t.card}${t.counted ? "" : " · left out"}</span></div><span class="today-focus-priority">${fmtTime(t.at)}</span></li>`).join("") + "</ul>"
    : h`<p class="muted">No payments today.</p>`;
  const trend = data.trend;
  // Targets are one list, so more kinds can be added later. Each is a bar with a one-word label;
  // the amounts are in the bar's accessible label and tooltip, not in page text.
  const t = data.targets || {};
  const targetList = [
    t.daily != null ? { label: "Day", spent: s.today, target: t.daily } : null,
    t.weekly != null ? { label: "Week", spent: s.weekTotal, target: t.weekly } : null
  ].filter(Boolean);
  const meters = targetList.map(m => {
    const pct = Math.min(100, Math.round(m.spent / m.target * 100));
    const said = m.label + ": " + money(m.spent) + " of " + money(m.target);
    return h`<div class="spend-meter${m.spent > m.target ? " over" : ""}" title="${said}"><span class="spend-meter-label">${m.label}</span>
      <div class="spend-meter-track" role="progressbar" aria-label="${said}" aria-valuemin="0" aria-valuemax="${m.target}" aria-valuenow="${m.spent}"><span style="width:${pct}%"></span></div></div>`;
  }).join("");
  // Seven-day bars, today highlighted. A daily target shows as a dashed line across the chart.
  const dayName = date => new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" }).format(new Date(date + "T12:00:00Z"));
  const peak = trend ? Math.max(...trend.days.map(d => d.total), 0) : 0;
  const max = Math.max(peak, t.daily != null && peak > 0 ? t.daily : 0);
  const BAR = 64;
  const line = t.daily != null && max > 0 ? h`<span class="spend-target-line" style="bottom:${Math.round(t.daily / max * BAR) + 20}px" title="${"Daily target " + money(t.daily)}"></span>` : "";
  const chart = trend && peak > 0 ? h`<div class="spend-chart" role="img" aria-label="${"Last 7 days: " + trend.days.map(d => dayName(d.date) + " " + money(d.total)).join(", ") + (t.daily != null ? ". Daily target " + money(t.daily) : "")}">
      ${raw(line)}${raw(trend.days.map((d, i) => h`<div class="spend-day${i === 6 ? " today" : ""}${t.daily != null && d.total > t.daily ? " over" : ""}" title="${dayName(d.date) + " " + money(d.total)}"><span class="spend-val">${d.total ? "$" + Math.round(d.total) : ""}</span><span class="spend-bar" style="height:${Math.max(d.total ? 6 : 2, Math.round(d.total / max * BAR))}px"></span><span class="spend-dlabel">${i === 6 ? "Today" : dayName(d.date).slice(0, 2)}</span></div>`).join(""))}
    </div>` : "";
  main.innerHTML = h`<section class="today-dashboard promised-today">
      <div class="today-top-heading"><h2>Spending</h2></div>
      ${data.enabled ? "" : raw(h`<p class="apple-state warn"><b>Counting is off.</b> To turn it on, select Count my Apple Pay payments below.</p>`)}
      <div class="today-focus-card">
        <div class="today-focus-heading"><h3>${money(s.today)} today</h3><span class="muted">${s.todayCount} ${s.todayCount === 1 ? "payment" : "payments"}</span></div>
        ${meters ? raw(h`<div class="spend-meters">${raw(meters)}</div>`) : ""}
        ${raw(chart)}
        ${data.byKind && data.byKind.length > 1 ? raw(h`<p class="spend-kinds">${data.byKind.map(k => k.kind.replace(/-/g, " ") + " " + money(k.total)).join(" · ")}</p>`) : ""}
        ${raw(taps)}
      </div>
      ${raw(status)}
      <p class="muted">Daybook counts only Apple Pay payments in stores. It does not count card swipes, online or in-app payments, cash or bills.</p>
    </section>`;
  try { main.append(await renderSignalSettings()); } catch (error) { console.warn("Signal settings unavailable", error); }
}

/* ---------- Router ---------- */
let currentHash = location.hash;
// Views render straight into #main, so a slow render can land after a newer navigation. Each route has a
// number; if an out-of-date one finishes after the latest has already drawn, draw the latest again.
let routeSeq = 0, routeDone = 0, staleDrew = false;
async function route() {
  const seq = ++routeSeq;
  document.querySelectorAll(".toast").forEach(t => t.remove());
  closeSheet(); clearDirty();
  currentHash = location.hash;
  const hash = decodeURIComponent(location.hash.slice(1)) || "today";
  const [view, ...rest] = hash.split("/");
  const arg = rest.join("/");
  drawNav(view, arg);
  $("#composer").hidden = view !== "today" && hash !== "today";
  try {
    if (!cfg.configured) { $("#tabs").hidden = true; $("#subtabs").hidden = true; $("#composer").hidden = true; await views.setup(); }
    else if (view === "awareness") await renderAwareness();
    else if (view === "spending") await renderSpending();
    else if (view === "note") await editor(arg);
    else if (view === "new") await editor(null, arg || "inbox");
    else await (views[view] || views.today)();
  } catch (e) { if (e instanceof Locked) showLock(); else main.innerHTML = h`<p class="err">${e.message}</p>`; }
  if (seq !== routeSeq) { if (routeDone === routeSeq) route(); else staleDrew = true; return; }
  routeDone = seq;
  if (staleDrew) { staleDrew = false; return route(); }
  window.scrollTo(0, 0);
  if (nextToast) { toast(nextToast); nextToast = null; }
}
window.addEventListener("hashchange", () => {
  if (isDirty() && !confirm("Discard your changes?")) {
    history.replaceState(null, "", currentHash || "#today");
    return;
  }
  route();
});

  const b = e.target.closest(".chip"); if (!b) return;
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
  $("#entry").focus();
};
const when = $("#when"), timebtn = $("#timebtn");
timebtn.onclick = () => {
  when.value = hhmm(Date.now());
  timebtn.hidden = true; when.hidden = false; when.focus();
  if (when.showPicker) try { when.showPicker(); } catch {}
};
const resetWhen = () => { when.value = ""; when.hidden = true; timebtn.hidden = quickMode !== "log"; setQuickWhen("none"); };
// Task mode: one tap for no date, today or tomorrow; "More options…" opens the full Add a task form.
let quickWhen = "none";
function setQuickWhen(v) {
  quickWhen = v;
  document.querySelectorAll("[data-quick-when]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.quickWhen === v)));
}
document.querySelectorAll("[data-quick-when]").forEach(b => b.onclick = () => {
  if (b.dataset.quickWhen !== "more") return setQuickWhen(b.dataset.quickWhen);
  const prefill = $("#entry").value.trim();
  taskSheet({ prefill, when: quickWhen, onSaved: () => { $("#entry").value = ""; setQuickWhen("none"); views.today(); } });
});
const composerToggle = $("#composer-toggle");
function setComposerCollapsed(collapsed) {
  $("#composer").dataset.collapsed = String(collapsed);
  composerToggle.setAttribute("aria-expanded", String(!collapsed));
  $("#composer-chevron").textContent = collapsed ? "+" : "−";
  $("#composer-label").textContent = "Capture something";
  try { localStorage.setItem("daybook-composer-collapsed", String(collapsed)); } catch {}
}
try { setComposerCollapsed(localStorage.getItem("daybook-composer-collapsed") !== "false"); } catch { setComposerCollapsed(true); }
composerToggle.onclick = () => setComposerCollapsed($("#composer").dataset.collapsed !== "true");
$("#composer").onsubmit = async e => {
  e.preventDefault();
  const input = $("#entry"), value = input.value.trim();
  if (!value) return input.focus();
  $("#logbtn").disabled = true;
  try {
    if (quickMode === "log") {
      const tags = [...chips.querySelectorAll('[aria-pressed="true"]')].map(b => "#" + b.dataset.tag);
      const entry = [value, ...tags.filter(t => !value.includes(t))].join(" ").trim();
      const body = {entry};
      if (!when.hidden && when.value && when.value !== hhmm(Date.now())) body.time = when.value;
      await api("/log", {method:"POST",body});
      toast("Logged");
    } else if (quickMode === "task") {
      const { schedule, error } = scheduleFor(quickWhen, {});
      if (error) { toast(error); $("#logbtn").disabled = false; return; }
      await api("/task", { method: "POST", body: { text: value, schedule } });
      toast(addedMessage(quickWhen));
    } else {
      const content = "# " + value.split("\n")[0].slice(0,110) + "\n\n" + value.split("\n").slice(1).join("\n");
      await api("/note", {method:"POST",body:{content,category:"inbox"}});
      toast("Note saved to inbox");
    }
    input.value = ""; resetWhen(); chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed","false"));
    await views.today();
  } catch(err) { handle(err); }
  $("#logbtn").disabled = false;
};
$("#lockbtn").onclick = async () => {
  if (isDirty() && !confirm("Discard your changes?")) return;
  clearDirty();
  await fetch("/app/logout", { method: "POST" }); showLock();
};

// Coming back to the app (it stays open in the background on a phone): refresh the date and the page.
let hiddenAt = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  drawDate();
  if (!(hiddenAt && Date.now() - hiddenAt > 60_000 && !isDirty() && !sheet.open && !$("#tabs").hidden)) return;
  // A phone keeps the app open for days. If Daybook was updated meanwhile, load the new version
  // rather than redrawing with the old code (new features would otherwise appear only after a reload).
  try {
    const latest = await api("/config");
    if (cfg && latest.version && cfg.version && latest.version !== cfg.version) { location.reload(); return; }
  } catch { /* offline or locked: the normal redraw below handles it */ }
  route();
});

drawDate();
start().then(route).catch(e => (e instanceof Locked ? showLock() : (main.innerHTML = h`<p class="err">${e.message}</p>`)));
</script>
</body>
</html>
