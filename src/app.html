<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191A23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/app/manifest.webmanifest">
<title>Day book</title>
<script>
// Restore appearance before the first paint. Browsers may block local storage.
function applyTheme(theme) {
  if (theme !== "light" && theme !== "dark") theme = "system";
  if (theme === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
    const dark = theme === "dark" || (theme === "system" && meta.media.includes("dark"));
    meta.content = dark ? "#191A23" : "#F6F5F2";
  });
}
let initialTheme = document.documentElement.dataset.theme || "system";
try { initialTheme = localStorage.getItem("daybook-theme") || initialTheme; } catch {}
applyTheme(initialTheme);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F5F2;
  --sheet: #FFFFFF;
  --ink: #242633;
  --ink-2: #696A7A;
  --rule: #DEDEE6;
  --control: #8C8C9E;
  --mark: #5453C6;
  --mark-ink: #FFFFFF;
  --done: #2F7659;
  --danger: #B33D48;
  --shadow: 0 2px 8px rgb(36 38 51 / .06), 0 1px 2px rgb(36 38 51 / .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #191A23; --sheet: #232530; --ink: #ECECF3; --ink-2: #AFB0C2;
    --rule: #414353; --control: #73758A; --mark: #A6A5FF; --mark-ink: #191A23;
    --done: #89CDA6; --danger: #FF9EA8;
    --shadow: 0 2px 10px rgb(0 0 0 / .18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #191A23; --sheet: #232530; --ink: #ECECF3; --ink-2: #AFB0C2;
  --rule: #414353; --control: #73758A; --mark: #A6A5FF; --mark-ink: #191A23;
  --done: #89CDA6; --danger: #FF9EA8;
  --shadow: 0 2px 10px rgb(0 0 0 / .18);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 "DM Sans", system-ui, sans-serif;
  min-height: 100dvh;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.shell { max-width: 680px; margin: 0 auto; padding: env(safe-area-inset-top) 20px 0; }

/* Masthead: the date is the title of every page. */
.mast { padding: 22px 0 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.mastcopy { min-width: 0; }
.mast-actions { display: flex; align-items: center; gap: 8px; }
.appearance { position: relative; }
.appearance summary { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 50%; background: var(--sheet); color: var(--ink-2); cursor: pointer; list-style: none; box-shadow: var(--shadow); }
.appearance summary::-webkit-details-marker { display: none; }
.appearance svg { width: 20px; height: 20px; flex: none; }
.theme-menu { position: absolute; z-index: 20; right: 0; top: calc(100% + 8px); width: 160px; padding: 6px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / .18); }
.theme-menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 9px; background: none; color: var(--ink); text-align: left; font-size: 14px; }
.theme-menu button:hover, .theme-menu button[aria-pressed="true"] { background: var(--paper); }
.theme-menu button[aria-pressed="true"]::after { content: "✓"; margin-left: auto; color: var(--mark); font-weight: 700; }
.brand { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; color: var(--ink-2); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.brandmark { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--mark); color: var(--mark-ink); font: 16px/1 "DM Serif Display", Georgia, serif; letter-spacing: 0; }
.date { margin: 0; line-height: 1; }
.date .dow { display: block; font-size: 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 3px; }
.date .day { font: 400 clamp(48px, 13vw, 66px)/.98 "DM Serif Display", Georgia, serif; letter-spacing: -.035em; }
.date .mon { font: 400 20px/1 "DM Serif Display", Georgia, serif; margin-left: 7px; color: var(--ink-2); }
.lockbtn { min-height: 44px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 8px 15px; box-shadow: var(--shadow); }

nav.tabs { display: flex; gap: 4px; border: 1px solid var(--rule); border-radius: 14px; padding: 4px; margin: 0; overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--sheet) 68%, transparent); }
nav.tabs a { display: flex; min-height: 44px; align-items: center; padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 10px; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
nav.tabs a[aria-current="page"] { color: var(--mark-ink); background: var(--mark); box-shadow: 0 1px 2px rgb(36 38 51 / .18); }

main { padding: 22px 0 calc(170px + env(safe-area-inset-bottom)); }
.empty { color: var(--ink-2); padding: 28px 0; }
.err { color: var(--danger); font-weight: 600; }

/* Today: the time rail. */
.rail { position: relative; margin: 0; padding: 0; list-style: none; }
.rail::before { content: ""; position: absolute; left: 76px; top: 6px; bottom: 6px; width: 2px; background: var(--rule); }
.ev { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 26px; padding: 10px 0; align-items: baseline; }
.ev time, .rem time { font-variant-numeric: tabular-nums; }
.ev time { text-align: right; color: var(--ink-2); font-size: 15px; white-space: nowrap; }
.ev::after { content: ""; position: absolute; left: 72px; top: 17px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.ev.done-ev::after { background: var(--done); }
.ev.up::after { background: var(--paper); box-shadow: inset 0 0 0 2px var(--mark); }
.ev .what { overflow-wrap: anywhere; }
.ev .tags { color: var(--ink-2); font-size: 15px; }
.ev.up .what { font-weight: 600; }
.ev .sub { display: block; font-size: 14px; color: var(--ink-2); }
.ev .body { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.ev .mk { flex: none; background: none; border: 1.5px solid var(--mark); color: var(--mark); border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 600; }
.now { position: relative; height: 0; margin: 14px 0; border-top: 2px solid var(--mark); }
.now span { position: absolute; left: 0; top: -12px; background: var(--mark); color: var(--mark-ink); font-size: 13px; font-weight: 800; padding: 2px 7px; border-radius: 4px; }
.later { margin: 28px 0 8px; font-size: 15px; color: var(--ink-2); }


/* Logs: mobile-first, full-width capture with quieter secondary actions. */
.logs-page { display: grid; gap: 18px; }
.logs-page .step { margin: 0; }
.logs-page .log-fields { display: grid; gap: 12px; }
.logs-page .log-fields label { display: block; margin: 0 0 5px; }
.logs-page input, .logs-page select, .logs-page textarea { box-sizing: border-box; width: 100%; min-width: 0; max-width: 100%; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
.logs-page textarea { resize: vertical; min-height: 88px; }
.logs-page .log-duration { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logs-page .log-duration input { width: 112px; }
.logs-page .log-duration .muted { flex: 1; min-width: 160px; margin: 0; font-size: 13px; }
.logs-page .log-submit { display: flex; justify-content: flex-end; margin-top: 6px; }
.logs-page .log-submit .btn { min-height: 44px; }
.logs-page .log-create { display: flex; gap: 10px; align-items: center; }
.logs-page .log-create input { flex: 1; }
.logs-page .log-create button { flex: none; }
.logs-page details.step summary { cursor: pointer; font-weight: 600; }
.logs-page .log-types { display: grid; gap: 8px; }
.logs-page .log-type-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.logs-page .log-type-row:last-child { border-bottom: 0; }

/* Composer: thumb zone. */
.composer { position: fixed; z-index: 8; left: 50%; right: auto; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100% - 24px), 640px); background: color-mix(in srgb, var(--sheet) 92%, transparent); border: 1px solid var(--rule); border-radius: 20px; padding: 12px 14px; box-shadow: 0 12px 36px rgb(36 38 51 / .13); backdrop-filter: blur(18px); }
.composer .in { max-width: 640px; margin: 0 auto; }
.composer-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 4px; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.composer[data-collapsed="true"] .in { display: none; }
.composer[data-collapsed="true"] { padding: 2px 12px; width: max-content; min-width: 140px; max-width: calc(100% - 24px); border-radius: 999px; }
.composer[data-collapsed="true"] .composer-toggle { min-height: 42px; gap: 20px; }
.composer:not([data-collapsed="true"]) { max-height: min(45dvh, 310px); overflow-y: auto; }
.composer[hidden] { display: none !important; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.chip { flex: none; min-height: 44px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 15px; color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 12px 14px; }
.row input:focus { border-color: var(--ink); outline: none; }
.btn { border: 0; background: var(--mark); color: var(--mark-ink); border-radius: 12px; padding: 12px 18px; font-weight: 700; }
.btn:disabled { opacity: .5; }
.btn.quiet { background: none; color: var(--ink); border: 1.5px solid var(--control); }
.btn.danger { background: none; color: var(--danger); border: 1.5px solid var(--danger); }

/* Lists */
.search { width: 100%; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h2.group { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 22px 0 4px; }
h2.group b { color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; }
.list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; }
.list a .t { font-weight: 600; overflow-wrap: anywhere; }
.list a .d { color: var(--ink-2); font-size: 15px; white-space: nowrap; }

/* Goals */
.goal { padding: 18px; border: 1px solid var(--rule); border-radius: 16px; background: var(--sheet); box-shadow: var(--shadow); margin: 0 0 12px; }
.goal h3 { margin: 0 0 4px; font: 400 24px/1.2 "DM Serif Display", Georgia, serif; letter-spacing: -.01em; }
.goal h3 a { color: inherit; text-decoration: none; }
.goal .meta { color: var(--ink-2); font-size: 15px; }
.meter { display: flex; gap: 3px; margin: 12px 0 10px; }
.meter i { flex: 1; height: 8px; border-radius: 2px; background: var(--rule); }
.meter i.on { background: var(--ink); }
.goal .next { font-size: 16px; }
.goal .next span { color: var(--ink-2); }

/* Reminders */
.rem { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.rem time { color: var(--ink-2); }
.rem .sub { display: block; font-size: 14px; color: var(--ink-2); }
.rem .sub a { color: inherit; }

/* Editor and forms: a top bar that stays put, so Save is never under the keyboard. */
.edbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); padding: 10px 0; margin: -10px 0 10px; border-bottom: 1px solid var(--rule); }
.edbar .left, .edbar .right { display: flex; gap: 8px; align-items: center; }
.link { background: none; border: 0; padding: 8px 2px; color: var(--ink); font-weight: 600; text-decoration: none; }
.link.back::before { content: "\2039"; font-size: 26px; line-height: 0; margin-right: 6px; position: relative; top: 2px; }
.btn.small { padding: 8px 16px; border-radius: 10px; }
.where { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
.field { display: block; margin: 0 0 14px; }
.field > span { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.field input, .field textarea, .field select, .title-in, textarea.body-in {
  width: 100%; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 11px 14px; }
.field input:focus, .field textarea:focus, .title-in:focus, textarea.body-in:focus { border-color: var(--ink); outline: none; }
.title-in { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 10px; }
textarea.body-in { min-height: 40dvh; line-height: 1.55; resize: none; overflow: hidden; }
.hint { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.doc { background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 8px 20px 18px; box-shadow: var(--shadow); overflow-wrap: anywhere; cursor: text; }
.doc h1 { font: 400 32px/1.15 "DM Serif Display", Georgia, serif; letter-spacing: -0.02em; margin: 16px 0 8px; }
.doc h2 { font-size: 20px; margin: 20px 0 6px; }
.doc h3 { font-size: 17px; margin: 16px 0 4px; }
.doc ul { padding-left: 20px; margin: 8px 0; }
.doc li.task { list-style: none; margin-left: -20px; padding: 3px 0; }
.doc li.task label { display: flex; min-height: 44px; padding: 8px 0; gap: 10px; align-items: flex-start; cursor: pointer; }
.doc li.task input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); flex: none; cursor: pointer; }
.doc li.task.checked span { color: var(--ink-2); text-decoration: line-through; }
.doc .when { color: var(--mark); font-weight: 600; white-space: nowrap; }
.doc code { background: var(--paper); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
.doc a { color: var(--ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.danger-link { display: block; margin: 36px 0 0; background: none; border: 0; padding: 8px 0; color: var(--danger); font-weight: 600; }

/* Centered editors with room to scroll on short screens. */
dialog.sheet { border: 1px solid var(--rule); padding: 0; width: calc(100% - 32px); max-width: 520px; margin: auto; background: var(--sheet); color: var(--ink); border-radius: 20px; max-height: calc(100dvh - 32px); overflow-y: auto; box-shadow: 0 24px 64px rgb(0 0 0 / .22); }
dialog.sheet::backdrop { background: rgb(10 14 30 / .45); }
dialog.sheet form { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
dialog.sheet h2 { margin: 0 0 14px; font-size: 21px; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 6px; }
.sheet-actions .spacer { flex: 1; }
.seg { display: inline-flex; border: 1.5px solid var(--control); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.seg button { background: none; border: 0; padding: 8px 16px; color: var(--ink-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.days { display: flex; gap: 6px; margin-bottom: 8px; }
.days button { flex: 1; aspect-ratio: 1; max-width: 44px; border-radius: 50%; border: 1.5px solid var(--control); background: var(--sheet); font-weight: 600; color: var(--ink-2); }
.days button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.repeat-say { font-size: 14px; color: var(--ink-2); margin: 0 0 14px; }
.two { display: flex; gap: 10px; } .two .field { flex: 1; min-width: 0; }
.formerr { color: var(--danger); font-weight: 600; margin: 0 0 10px; }

/* Log rows are tappable */
.ev button.entry { all: unset; cursor: pointer; display: block; }
.ev button.entry:focus-visible { outline: 2px solid var(--mark); outline-offset: 4px; border-radius: 4px; }
.ev.due::after { background: var(--mark); }
.ev.due .sub { color: var(--mark); }
.timebtn { flex: none; min-height: 44px; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 0 12px; font-weight: 600; color: var(--ink-2); min-width: 64px; }
.timebtn.set { color: var(--ink); border-color: var(--ink); }
#when { flex: none; width: 112px; }
.goal .next { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.goal .next input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }
.goal .next .lbl { color: var(--ink-2); }
.rem { grid-template-columns: 76px 1fr auto; align-items: start; }
.rem .mk, .ev .mk { flex: none; min-height: 44px; background: none; border: 1.5px solid var(--mark); color: var(--mark); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.rem a.what { color: inherit; text-decoration: none; }

/* Lock */
.lock { padding-top: 10dvh; }
.lock p { color: var(--ink-2); max-width: 32ch; }
.lock input { width: 100%; border: 1.5px solid var(--control); background: var(--sheet); border-radius: 12px; padding: 13px 14px; margin: 8px 0 12px; }
.lock label { font-weight: 600; }


/* Setup */
.setup h2 { font-size: 24px; letter-spacing: -0.01em; margin: 6px 0 4px; }
.setup .lede { color: var(--ink-2); margin: 0 0 18px; }
.step { background: var(--sheet); border-radius: 14px; padding: 16px 16px 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
.step h3 { margin: 0 0 6px; font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.step h3 .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 14px; display: inline-grid; place-items: center; }
.step.ok h3 .n { background: var(--done); }
.step p, .step ol { margin: 6px 0 10px; }
.step ol { padding-left: 20px; }
.step li { margin: 4px 0; }
.step .muted { color: var(--ink-2); font-size: 15px; }
.step input[type=text], .step input[type=password], .step select { width: 100%; border: 1.5px solid var(--control); background: var(--paper); border-radius: 12px; padding: 12px 14px; margin: 4px 0 10px; }
.step label { font-weight: 600; display: block; }
.btn.a-btn { display: inline-block; text-decoration: none; }
.choices { list-style: none; padding: 0; margin: 6px 0 10px; }
.choices label { display: flex; gap: 10px; align-items: center; font-weight: 400; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.choices input { width: 20px; height: 20px; accent-color: var(--ink); }
.copyrow { display: flex; gap: 8px; align-items: center; }
.ghcode { font-size: 28px !important; letter-spacing: .12em; text-align: center; font-weight: 600; }
.gh-ok { color: var(--done); font-weight: 600; }
.copyrow code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
details.more summary { min-height: 44px; padding: 10px 0; cursor: pointer; color: var(--ink-2); margin: 4px 0; }
.toast { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 28px rgb(0 0 0 / .18); }
@media (max-width: 480px) {
  .shell { padding-left: 16px; padding-right: 16px; }
  .mast { padding-top: 16px; }
  nav.tabs { gap: 2px; }
  nav.tabs a { padding: 8px 10px; font-size: 13px; }
  .ev { grid-template-columns: 52px 1fr; gap: 20px; }
  .rail::before { left: 64px; }
  .ev::after { left: 60px; }
  .composer { bottom: calc(10px + env(safe-area-inset-bottom)); padding: 10px; }
  .chips { gap: 6px; }
  .chip { padding-left: 10px; padding-right: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
}
</style>
</head>
<body>
<div class="shell">
  <header class="mast">
    <div class="mastcopy">
      <p class="brand"><span class="brandmark" aria-hidden="true">d</span> Daybook</p>
      <h1 class="date" id="date"></h1>
    </div>
    <div class="mast-actions">
      <details class="appearance" id="appearance">
        <summary id="theme-toggle" aria-label="Appearance: System" title="Appearance: System"></summary>
        <div class="theme-menu" role="group" aria-label="Appearance">
          <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </details>
      <button class="lockbtn" id="lockbtn" hidden>Lock</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" hidden aria-label="Sections">
    <a href="#today">Today</a>
    <a href="#notes">Notes</a>
    <a href="#logs">Logs</a>
    <a href="#goals">Goals</a>
    <a href="#reminders">Reminders</a>

</div>

<form class="composer" id="composer" hidden autocomplete="off" data-collapsed="true">
  <button class="composer-toggle" id="composer-toggle" type="button" aria-expanded="true" aria-controls="composer-fields"><span id="composer-label">+ Quick log</span><span id="composer-chevron" aria-hidden="true">⌄</span></button>
  <div class="in">
    <div class="chips" id="chips" role="group" aria-label="Tags"></div>
    <div class="row">
      <button type="button" class="timebtn" id="timebtn" aria-label="Time: now. Tap to change">Now</button>
      <input type="time" id="when" hidden aria-label="Time">

      <input id="entry" name="entry" placeholder="Log a meal, meds, a walk…" enterkeyhint="send">
      <button class="btn" id="logbtn" type="submit">Log</button>
    </div>

</form>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script>
"use strict";
const TAGS = ["food", "drink", "med", "exercise", "sleep", "mood"];
const DAYS = ["S", "M", "T", "W", "T", "F", "S"];
const DAY_IDS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const DAY_NAMES = ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"];
const $ = (s, el = document) => el.querySelector(s);
const appearance = $("#appearance"), themeToggle = $("#theme-toggle");
const themeIcons = {
  system: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
  dark: '<path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/>'
};
const themeIcon = theme => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${themeIcons[theme]}</svg>`;
function drawThemeChoice() {
  const theme = document.documentElement.dataset.theme || "system";
  const label = "Appearance: " + theme[0].toUpperCase() + theme.slice(1);
  themeToggle.innerHTML = themeIcon(theme);
  themeToggle.setAttribute("aria-label", label); themeToggle.title = label;
  appearance.querySelectorAll("[data-theme-choice]").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme));
    button.innerHTML = themeIcon(button.dataset.themeChoice) + button.dataset.themeChoice[0].toUpperCase() + button.dataset.themeChoice.slice(1);
  });
}
drawThemeChoice();
appearance.addEventListener("click", e => {
  const button = e.target.closest("[data-theme-choice]"); if (!button) return;
  applyTheme(button.dataset.themeChoice);
  try { localStorage.setItem("daybook-theme", button.dataset.themeChoice); } catch {}
  drawThemeChoice(); appearance.open = false; themeToggle.focus();
});
document.addEventListener("click", e => { if (!appearance.contains(e.target)) appearance.open = false; });
appearance.addEventListener("keydown", e => {
  if (e.key === "Escape") { appearance.open = false; themeToggle.focus(); e.preventDefault(); }
});
const main = $("#main");
const sheet = $("#sheet");
let cfg = { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone, categories: [], push: true };

const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const h = (strings, ...vals) => strings.reduce((out, s, i) => out + s + (i < vals.length ? (vals[i] && vals[i].__html !== undefined ? vals[i].__html : esc(vals[i] ?? "")) : ""), "");
const raw = html => ({ __html: html });

/* ---------- Time, always in the owner's time zone ---------- */
const parts = (ms = Date.now()) => Object.fromEntries(new Intl.DateTimeFormat("en-US", {
  timeZone: cfg.timeZone, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
}).formatToParts(new Date(ms)).map(p => [p.type, p.value]));
const dayKey = ms => { const p = parts(ms); return p.year + "-" + p.month + "-" + p.day; };
const hhmm = ms => { const p = parts(ms); return p.hour + ":" + p.minute; };
const fmt12 = t => { let [H, M] = t.split(":").map(Number); const ap = H >= 12 ? "pm" : "am"; H = H % 12 || 12; return H + (M ? ":" + String(M).padStart(2, "0") : "") + ap; };
const longDay = ms => new Intl.DateTimeFormat("en-US", { timeZone: cfg.timeZone, weekday: "short", month: "short", day: "numeric" }).format(new Date(ms));
const shortDate = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

function drawDate() {
  const now = new Date();
  const f = o => new Intl.DateTimeFormat("en-US", { timeZone: cfg.timeZone, ...o }).format(now);
  $("#date").innerHTML = h`<span class="dow">${f({ weekday: "long" })}</span><span class="day">${f({ day: "numeric" })}</span><span class="mon">${f({ month: "short" })}</span>`;
}

let toastTimer, nextToast = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.role = "status"; t.textContent = msg;
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}

class Locked extends Error {}
async function api(path, opts = {}) {
  const res = await fetch("/app/api" + path, {
    ...opts, credentials: "same-origin",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401) throw new Locked();
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ")");
  return data;
}
function savedMessage(res, base) {
  const n = res && res.reminders ? res.reminders.length : 0;
  let msg = base + (n ? ", " + n + " reminder" + (n > 1 ? "s" : "") + " set" : "");
  if (res && res.warning) msg += /NTFY_TOPIC/.test(res.warning) ? ". Phone notifications are off (turn them on in Setup)." : ". " + res.warning;
  return msg;
}

/* ---------- Note names and Markdown ---------- */
function titleFrom(name, content) {
  const head = content && /^#\s+(.+)$/m.exec(content);
  if (head) return head[1].trim();
  const file = name.split("/").pop().replace(/\.md$/, "");
  const m = /^\d{4}-\d{2}-\d{2}-(.+)$/.exec(file);
  const slug = m ? m[1] : file;
  if (/^\d{8}T\d{6}Z?-[0-9a-f]{8}$/.test(slug) || slug === "note") return "Untitled note";
  return slug.replace(/-\d+$/, "").replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
}
function dateFrom(name) {
  const m = /(\d{4})-?(\d{2})-?(\d{2})/.exec(name.split("/").pop());
  return m ? shortDate(m[1] + "-" + m[2] + "-" + m[3]) : "";
}
const folderName = c => ({ inbox: "Inbox", goals: "Goals", projects: "Projects", decisions: "Decisions", runbooks: "Runbooks", reference: "Reference", journal: "Journal" }[c] || c);
/** Split a note into its "# Title" line and the rest. */
function splitTitle(content) {
  const m = /^\s*#\s+(.*)\n?/.exec(content);
  if (!m) return { title: "", body: content.replace(/^\n+/, "") };
  return { title: m[1].trim(), body: content.slice(m[0].length).replace(/^\n+/, "") };
}
const joinTitle = (title, body) => (title.trim() ? "# " + title.trim() + "\n\n" : "") + body.replace(/\s+$/, "") + "\n";

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>');
}
const SCHED = /\s+@((?:\d{4}-\d{2}-\d{2}|daily|everyday|weekdays|weekends|[a-z]{3,9}(?:,[a-z]{3,9})*)(?:\s+[\d:apm, ]+)?)\s*$/i;
function niceSched(spec) {
  const [when, ...times] = spec.trim().split(/\s+/);
  const t = times.join(" ").split(",").map(x => x.trim()).filter(Boolean).map(x => /^\d{1,2}:\d{2}$/.test(x) ? fmt12(x) : x).join(", ");
  const day = /^\d{4}-\d{2}-\d{2}$/.test(when) ? shortDate(when)
    : ({ daily: "daily", everyday: "daily", weekdays: "weekdays", weekends: "weekends" }[when.toLowerCase()] || when.replace(/,/g, ", "));
  return day + (t ? ", " + t : "");
}
function render(md) {
  const out = []; let list = false; let para = [];
  const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const close = () => { if (list) { out.push("</ul>"); list = false; } };
  md.split("\n").forEach((line, i) => {
    let m;
    if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { flush(); close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); return; }
    if ((m = /^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/.exec(line))) {
      flush(); if (!list) { out.push("<ul>"); list = true; }
      const checked = m[1] !== " ";
      const s = SCHED.exec(m[2]);
      const text = s ? m[2].slice(0, s.index) : m[2];
      out.push(`<li class="task${checked ? " checked" : ""}"><label><input type="checkbox" data-line="${i}" ${checked ? "checked" : ""}><span>${inline(text)}${s ? ` <span class="when">${esc(niceSched(s[1]))}</span>` : ""}</span></label></li>`);
      return;
    }
    if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { flush(); if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(m[1]) + "</li>"); return; }
    if (!line.trim()) { flush(); close(); return; }
    close(); para.push(line);
  });
  flush(); close();
  return out.join("");
}
/** Tick or untick task line `i` of a note and save. */
async function setTask(name, content, i, done, sha) {
  const lines = content.split("\n");
  lines[i] = lines[i].replace(/\[( |x|X)\]/, done ? "[x]" : "[ ]");
  const next = lines.join("\n");
  await api("/note", { method: "PUT", body: { name, content: next, sha } });
  return next;
}

/* ---------- Unsaved-changes guard ---------- */
let isDirty = () => false;
const clearDirty = () => { isDirty = () => false; };
window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Sheets ---------- */
function openSheet(html, wire) {
  sheet.innerHTML = html;
  sheet.showModal();
  wire(sheet);
  const first = sheet.querySelector("[autofocus]");
  if (first) first.focus();
}
const closeSheet = () => { if (sheet.open) sheet.close(); };
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
function sheetError(msg) {
  let el = sheet.querySelector(".formerr");
  if (!el) { el = document.createElement("p"); el.className = "formerr"; el.role = "alert"; sheet.querySelector(".sheet-actions").before(el); }
  el.textContent = msg;
}

/** Add a reminder (to `note`, or the inbox "Reminders" note). */
function reminderSheet(note, onSaved) {
  const nowMs = Date.now();
  const today = dayKey(nowMs);
  const nextHour = (Number(hhmm(nowMs).slice(0, 2)) + 1) % 24;
  const time = String(nextHour).padStart(2, "0") + ":00";
  const date = nextHour === 0 ? addDays(today, 1) : today;
  let repeat = false;
  const days = new Set([0, 1, 2, 3, 4, 5, 6]);
  openSheet(h`<form method="dialog" novalidate>
      <h2 id="sheet-title">New reminder</h2>
      <label class="field"><span>Remind me to</span><input id="r-text" autofocus required placeholder="Take meds, call the shop…" enterkeyhint="next"></label>
      <div class="seg" role="group" aria-label="How often"><button type="button" data-rep="0" aria-pressed="true">Once</button><button type="button" data-rep="1" aria-pressed="false">Repeats</button></div>
      <div id="r-once" class="two"><label class="field"><span>Day</span><input type="date" id="r-date" value="${date}" min="${today}"></label>
        <label class="field"><span>Time</span><input type="time" id="r-time1" value="${time}"></label></div>
      <div id="r-rep" hidden>
        <div class="days" role="group" aria-label="Days">${raw(DAYS.map((d, i) => `<button type="button" data-day="${i}" aria-pressed="true" aria-label="${DAY_NAMES[i]}">${d}</button>`).join(""))}</div>
        <p class="repeat-say" id="r-say">Every day</p>
        <label class="field"><span>Time</span><input type="time" id="r-time2" value="${time}"></label>
      </div>
      <div class="sheet-actions"><button type="button" class="btn quiet" data-close>Cancel</button><button class="btn" id="r-save" type="submit">Add reminder</button></div>
    </form>`, el => {
    const say = () => {
      const d = [...days].sort();
      $("#r-say").textContent = d.length === 7 ? "Every day" : d.join() === "1,2,3,4,5" ? "Weekdays" : d.join() === "0,6" ? "Weekends"
        : d.length ? "On " + d.map(i => DAY_NAMES[i]).join(", ").replace(/, ([^,]*)$/, " and $1") : "Pick at least one day";
    };
    el.querySelectorAll("[data-rep]").forEach(b => b.onclick = () => {
      repeat = b.dataset.rep === "1";
      el.querySelectorAll("[data-rep]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("#r-once").hidden = repeat; $("#r-rep").hidden = !repeat;
    });
    el.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
      const i = +b.dataset.day;
      days.has(i) ? days.delete(i) : days.add(i);
      b.setAttribute("aria-pressed", String(days.has(i)));
      say();
    });
    el.querySelector("[data-close]").onclick = closeSheet;
    el.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const text = $("#r-text").value.trim();
      if (!text) return sheetError("Say what to remind you about.");
      let schedule;
      if (!repeat) {
        const d = $("#r-date").value, t = $("#r-time1").value;
        if (!d || !t) return sheetError("Pick a day and a time.");
        schedule = d + " " + t;
      } else {
        const d = [...days].sort(), t = $("#r-time2").value;
        if (!d.length) return sheetError("Pick at least one day.");
        if (!t) return sheetError("Pick a time.");
        const spec = d.length === 7 ? "daily" : d.join() === "1,2,3,4,5" ? "weekdays" : d.join() === "0,6" ? "weekends" : d.map(i => DAY_IDS[i]).join(",");
        schedule = spec + " " + t;
      }
      $("#r-save").disabled = true;
      try {
        const res = await api("/reminder", { method: "POST", body: { text, schedule, note } });
        closeSheet(); toast(savedMessage({ ...res, reminders: [1] }, "Reminder added").replace(", 1 reminder set", ""));
        onSaved && onSaved(res);
      } catch (err) { if (err instanceof Locked) { closeSheet(); return unlockSheet(); } sheetError(err.message); $("#r-save").disabled = false; }
    };
  });
}

/** Edit or delete one log line. */
function logEntrySheet(date, original, time, text) {
  openSheet(h`<form method="dialog" novalidate>
      <h2 id="sheet-title">Edit entry</h2>
      <label class="field"><span>What</span><input id="l-text" value="${text}" autofocus></label>
      <label class="field"><span>Time</span><input type="time" id="l-time" value="${time}"></label>
      <div class="sheet-actions"><button type="button" class="btn danger" id="l-del">Delete</button><span class="spacer"></span>
        <button type="button" class="btn quiet" data-close>Cancel</button><button class="btn" id="l-save" type="submit">Save</button></div>
    </form>`, el => {
    el.querySelector("[data-close]").onclick = closeSheet;
    const go = async body => {
      try { await api("/log/edit", { method: "POST", body: { date, original, ...body } }); closeSheet(); toast(body.remove ? "Entry deleted" : "Entry saved"); views.today(); }
      catch (err) { if (err instanceof Locked) { closeSheet(); return unlockSheet(); } sheetError(err.message); }
    };
    $("#l-del").onclick = () => go({ remove: true });
    el.querySelector("form").onsubmit = e => {
      e.preventDefault();
      const entry = $("#l-text").value.trim(), t = $("#l-time").value;
      if (!entry) return sheetError("Write something, or tap Delete.");
      if (!t) return sheetError("Pick a time.");
      go({ entry, time: t });
    };
  });
}

/** Append a dated line under "## Progress" in a goal note. */
function progressSheet(name, content, onSaved) {
  openSheet(h`<form method="dialog" novalidate>
      <h2 id="sheet-title">Add an update</h2>
      <label class="field"><span>What happened</span><textarea id="p-text" rows="3" autofocus placeholder="Ordered the battery, booked smog for Friday…"></textarea></label>
      <div class="sheet-actions"><button type="button" class="btn quiet" data-close>Cancel</button><button class="btn" id="p-save" type="submit">Add update</button></div>
    </form>`, el => {
    el.querySelector("[data-close]").onclick = closeSheet;
    el.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const text = $("#p-text").value.replace(/\s+/g, " ").trim();
      if (!text) return sheetError("Write the update first.");
      const line = "- " + dayKey(Date.now()) + ": " + text;
      const lines = content.replace(/\s+$/, "").split("\n");
      let at = lines.findIndex(l => /^##\s+Progress\s*$/i.test(l));
      if (at < 0) { lines.push("", "## Progress", line); }
      else { let end = at + 1; while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++; while (end > at + 1 && !lines[end - 1].trim()) end--; lines.splice(end, 0, line); }
      const next = lines.join("\n") + "\n";
      $("#p-save").disabled = true;
      try { await api("/note", { method: "PUT", body: { name, content: next } }); closeSheet(); toast("Update added"); onSaved(next); }
      catch (err) { if (err instanceof Locked) { closeSheet(); return unlockSheet(); } sheetError(err.message); $("#p-save").disabled = false; }
    };
  });
}

async function complete(note, text, at) {
  await api("/complete", { method: "POST", body: { note, text, at } });
  toast("Done");
}

/* ---------- Views ---------- */
const views = {};

views.today = async () => {
  if (!main.querySelector(".rail")) main.innerHTML = '<p class="empty">Loading today…</p>';
  const [logs, rems] = await Promise.all([api("/logs?days=1"), api("/reminders")]);
  const today = dayKey(Date.now());
  const entries = [];
  const log = logs.find(l => l.date === today);
  if (log) for (const line of log.content.split("\n")) {
    const m = /^- (\d{2}:\d{2}) (.*)$/.exec(line);
    if (m) entries.push({ kind: "log", t: m[1], text: m[2], line });
  }
  // Occurrences marked done (here, by Claude, or from the notification) drop off the list.
  const key = r => r.note + "\u0000" + r.text + "\u0000" + r.at;
  const seen = new Set(rems.doneToday.map(key));
  const agenda = [];
  for (const r of [...rems.firedToday, ...rems.upcoming.filter(r => dayKey(r.at) === today)]) {
    if (seen.has(key(r))) continue;
    seen.add(key(r));
    agenda.push({ kind: "rem", t: hhmm(r.at), r });
  }
  const nowT = hhmm(Date.now());
  const items = [...entries, ...agenda].sort((a, b) => a.t.localeCompare(b.t) || (a.kind === "log" ? -1 : 1));
  const later = rems.upcoming.filter(r => dayKey(r.at) > today).slice(0, 3);

  const row = it => {
    if (it.kind === "log") {
      const tags = (it.text.match(/#[\w-]+/g) || []).join(" ");
      const what = it.text.replace(/\s*#[\w-]+/g, "").trim();
      return h`<li class="ev${/^✓/.test(what) ? " done-ev" : ""}"><time>${fmt12(it.t)}</time><button class="entry" data-line="${it.line}" aria-label="Edit ${what} at ${fmt12(it.t)}"><span class="what">${what}</span> <span class="tags">${tags}</span></button></li>`;
    }
    const due = it.t <= nowT;
    return h`<li class="ev ${due ? "due" : "up"}"><time>${fmt12(it.t)}</time><div class="body"><div><span class="what">${it.r.text}</span>
      <span class="sub">${due ? "Due, " : ""}<a href="#note/${it.r.note}" style="color:inherit">${titleFrom(it.r.note)}</a>${it.r.repeat ? ", repeats" : ""}</span></div>
      <button class="mk" data-note="${it.r.note}" data-text="${it.r.text}" data-at="${it.r.at}" aria-label="Mark ${it.r.text} done">Done</button></div></li>`;
  };
  let html;
  if (!items.length) {
    html = `<p class="empty">Nothing logged yet today. Use the box at the bottom to log a meal, a drink, your meds or how you're feeling.</p>`;
  } else {
    const before = items.filter(i => i.t <= nowT), after = items.filter(i => i.t > nowT);
    html = (before.length ? '<ol class="rail">' + before.map(row).join("") + "</ol>" : "")
      + `<div class="now" role="separator" aria-label="Now"><span>${esc(fmt12(nowT))}</span></div>`
      + (after.length ? '<ol class="rail">' + after.map(row).join("") + "</ol>" : "");
  }
  if (later.length) {
    html += '<p class="later">Coming up</p><ol class="rail">' + later.map(r =>
      h`<li class="ev up"><time>${longDay(r.at).replace(/^\w+, /, "")}</time><div><a class="what" href="#note/${r.note}" style="color:inherit;text-decoration:none">${r.text}</a><span class="sub">${fmt12(hhmm(r.at))}</span></div></li>`).join("") + "</ol>";
  }
  if (!cfg.push) html += `<p class="hint">Reminders show here, but phone notifications are off.${cfg.canSetup ? ' Turn them on in <a href="#settings">Setup</a>.' : ""}</p>`;
  // GTD inbox and Eisenhower focus; priorities are explicit, never guessed from note content.
  try {
    const tasks = await api("/priorities");
    const groups = [
      ["do", "Do now", "Urgent and important"],
      ["plan", "Plan", "Important, not urgent"],
      ["delegate", "Handle or delegate", "Urgent, lower importance"],
      ["someday", "Someday / maybe", "Not urgent"],
      ["inbox", "Inbox · clarify", "Unsorted tasks"]
    ];
    const groupHtml = groups.map(([id, label, subtitle]) => {
      const matching = tasks.filter(t => t.priority === id);
      if (!matching.length) return "";
      return h`<details class="step" ${id === "do" || id === "inbox" ? "open" : ""}><summary><b>${label}</b> · ${matching.length} <span class="muted">${subtitle}</span></summary>
        <ul class="list">${raw(matching.slice(0, 30).map(t => h`<li><a href="#note/${t.note}">${t.text}</a>
          <select class="task-priority" data-note="${t.note}" data-line="${t.line}" aria-label="Priority for ${t.text}">

          </select></li>`).join(""))}</ul></details>`;
    }).join("");
    html = '<section class="focus"><h2>Focus</h2><p class="muted">Capture tasks anywhere using Markdown checkboxes. Sort only what matters.</p>' +
      (groupHtml || '<p class="muted">No open tasks yet. Add a checkbox task to any note.</p>') + '</section>' + html;
  } catch { html = '<p class="hint">Priorities are temporarily unavailable.</p>' + html; }
  main.innerHTML = html;
  main.querySelectorAll(".task-priority").forEach(select => select.onchange = async () => {
    select.disabled = true;
    try {
      const note = await api("/note?name=" + encodeURIComponent(select.dataset.note));
      await api("/priorities", { method: "POST", body: {
        name: select.dataset.note, line: Number(select.dataset.line), priority: select.value, sha: note.sha
      } });
      await views.today();
    } catch (e) { handle(e); select.disabled = false; }
  });
  main.querySelectorAll(".mk").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await complete(b.dataset.note, b.dataset.text, +b.dataset.at); views.today(); }
    catch (e) { handle(e); b.disabled = false; }
  });
  main.querySelectorAll("button.entry").forEach(b => b.onclick = () => {
    const m = /^- (\d{2}:\d{2}) (.*)$/.exec(b.dataset.line);
    // Safari does not focus clicked buttons; give the dialog a return target.
    b.focus({ preventScroll: true });
    logEntrySheet(today, b.dataset.line, m[1], m[2]);
  });
};

views.goals = async () => {
  main.innerHTML = '<p class="empty">Loading goals…</p>';
  const goals = await api("/goals");
  if (!goals.length) {
    main.innerHTML = `<p class="empty">No goals yet. Write down what you're aiming for, why, and a first step.</p><a class="btn" href="#new-goal" style="text-decoration:none;display:inline-block">New goal</a>`;
    return;
  }
  const today = dayKey(Date.now());
  main.innerHTML = goals.map((g, gi) => {
    const c = g.content;
    const lines = c.split("\n");
    const steps = lines.map((l, i) => [/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/.exec(l), i]).filter(([m]) => m);
    const done = steps.filter(([m]) => m[1] !== " ").length;
    const next = steps.find(([m]) => m[1] === " ");
    const target = (/Target:\s*(\d{4}-\d{2}-\d{2})/i.exec(c) || [])[1];
    const days = target ? Math.round((Date.parse(target) - Date.parse(today)) / 86400000) : null;
    const progress = [...c.matchAll(/^- (\d{4}-\d{2}-\d{2}): (.*)$/gm)].pop();
    const meta = [target ? (days > 0 ? days + " days left, due " + shortDate(target) : days === 0 ? "Due today" : Math.abs(days) + " days past " + shortDate(target)) : "",
                  steps.length ? done + " of " + steps.length + " steps done" : ""].filter(Boolean).join(", ");
    return h`<article class="goal"><h3><a href="#note/${g.name}">${titleFrom(g.name, c)}</a></h3>
      <div class="meta">${meta || "No steps yet"}</div>
      ${raw(steps.length ? '<div class="meter" aria-hidden="true">' + steps.map(([m]) => `<i class="${m[1] !== " " ? "on" : ""}"></i>`).join("") + "</div>" : "")}
      ${raw(next ? h`<label class="next"><input type="checkbox" data-goal="${gi}" data-line="${next[1]}"><span><span class="lbl">Next:</span> ${next[0][2].replace(SCHED, "")}</span></label>` : "")}
      ${raw(progress ? h`<div class="meta" style="margin-top:6px">Last update ${shortDate(progress[1])}: ${progress[2]}</div>` : "")}</article>`;
  }).join("") + `<p style="margin-top:20px"><a class="btn quiet" href="#new-goal" style="text-decoration:none;display:inline-block">New goal</a></p>`;

  });
};

/* ---------- Note: read, tap to edit ---------- */
async function editor(name, category) {
  const isNew = !name;
  const folder = isNew ? (category || "inbox") : name.split("/")[0];
  const backTo = folder === "goals" ? "#goals" : "#notes";
  const backLabel = folder === "goals" ? "Goals" : "Notes";
  let content = "";
  let revision;
  if (!isNew) {
    main.innerHTML = '<p class="empty">Opening note…</p>';
    const loaded = await api("/note?name=" + encodeURIComponent(name));
    content = loaded.content;
    revision = loaded.sha;
  }

  const read = () => {
    clearDirty();
    const isGoal = folder === "goals";
    main.innerHTML = h`<div class="edbar"><div class="left"><a class="link back" href="${backTo}">${backLabel}</a></div><div class="right"><button class="btn small" id="edit">Edit</button></div></div>
      <p class="where">In ${folderName(folder)}${dateFrom(name) ? ", created " + dateFrom(name) : ""}</p>
      ${raw(`<div class="doc" id="doc" title="Tap to edit">${content.trim() ? render(content) : '<p class="empty">This note is empty. Tap to write.</p>'}</div>`)}
      <div class="actions"><button class="btn quiet" id="addrem">Add reminder</button>${raw(isGoal ? '<button class="btn quiet" id="addupd">Add update</button>' : "")}</div>
      <button class="danger-link" id="del">Delete note</button>`;
    $("#edit").onclick = () => edit();
    $("#doc").onclick = e => { if (!e.target.closest("input, a, label")) edit(); };
    main.querySelectorAll("#doc input[data-line]").forEach(cb => cb.onchange = async () => {
      cb.disabled = true;
      try { content = await setTask(name, content, +cb.dataset.line, cb.checked, revision); revision = (await api("/note?name=" + encodeURIComponent(name))).sha; toast(cb.checked ? "Checked off" : "Unchecked"); }
      catch (e) { handle(e); }
      read();
    });
    $("#addrem").onclick = () => reminderSheet(name, async () => { const loaded = await api("/note?name=" + encodeURIComponent(name)); content = loaded.content; revision = loaded.sha; read(); });
    if (isGoal) $("#addupd").onclick = () => progressSheet(name, content, next => { content = next; revision = undefined; read(); });
    $("#del").onclick = async () => {
      if (!confirm("Delete this note? Any reminders in it stop too.")) return;
      try { await api("/note?name=" + encodeURIComponent(name), { method: "DELETE" }); nextToast = "Note deleted"; location.hash = backTo; }
      catch (e) { handle(e); }
    };
  };

  const edit = () => {
    const { title, body } = splitTitle(content);
    const cats = cfg.categories.filter(c => c !== "journal");
    main.innerHTML = h`<form id="edform" novalidate>
      <div class="edbar"><div class="left"><button type="button" class="link" id="cancel">Cancel</button></div><div class="right"><button class="btn small" id="save" type="submit">Save</button></div></div>
      ${raw(isNew ? h`<label class="field"><span>Folder</span><select id="cat">${raw(cats.map(c => h`<option value="${c}" ${c === folder ? "selected" : ""}>${folderName(c)}</option>`).join(""))}</select></label>` : "")}
      <label for="title" style="position:absolute;left:-9999px">Title</label><input class="title-in" id="title" value="${title}" placeholder="Title">
      <label for="body" style="position:absolute;left:-9999px">Note</label><textarea class="body-in" id="body" placeholder="Write anything. Start a line with - [ ] to make a checkbox.">${body}</textarea>
      <p class="hint">For a timed reminder, save and tap Add reminder.</p>
    </form>`;
    const ta = $("#body");
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 4, window.innerHeight * 0.4) + "px"; };
    ta.oninput = grow; grow();
    const original = joinTitle(title, body);
    const current = () => joinTitle($("#title").value, $("#body").value);
    isDirty = () => !!$("#edform") && current() !== original;
    (isNew || !title ? $("#title") : ta).focus();
    $("#cancel").onclick = () => {
      if (isDirty() && !confirm("Discard your changes?")) return;
      clearDirty();
      if (isNew) location.hash = backTo; else read();
    };
    $("#edform").onsubmit = async e => {
      e.preventDefault();
      const next = current();
      if (!$("#title").value.trim() && !$("#body").value.trim()) return toast("Write something before saving");
      $("#save").disabled = true;
      try {
        if (isNew) {
          const res = await api("/note", { method: "POST", body: { content: next, category: $("#cat").value } });
          clearDirty(); allNotes = null; nextToast = savedMessage(res, "Saved"); location.hash = "#note/" + res.name;
        } else {
          const res = await api("/note", { method: "PUT", body: { name, content: next, sha: revision } });
          content = next; revision = (await api("/note?name=" + encodeURIComponent(name))).sha; clearDirty(); read(); toast(savedMessage(res, "Saved"));
        }
      } catch (err) { handle(err); $("#save").disabled = false; }
    };
  };

  isNew ? edit() : read();
}

      <details class="more"><summary>Use an access key instead</summary>
        <p class="muted">Only if Connect GitHub doesn't work for you.${first ? " First create a private repository called notes:" : ""}</p>
        ${raw(first ? h`<p><a class="btn quiet a-btn" href="${GH_NEW_REPO}" target="_blank" rel="noopener">Create notes repository</a></p>` : "")}
        ${raw(keyFields)}</details></section>`
    : (first ? createRepoStep(1) : "") + h`<section class="step" id="s2"><h3><span class="n">${first ? 2 : 1}</span>Give this app a key to it</h3>${raw(keyFields)}</section>`;

  main.innerHTML = h`<div class="setup">
    <h2>${first ? "Let's set up your notes" : "Settings"}</h2>
    <p class="lede">${first ? "About 5 minutes. Your notes are saved to your own private GitHub repository; nobody else can see them." : "Change where notes are saved, your time zone, or phone notifications."}</p>

    ${raw(githubBlock)}
    <section class="step" id="diagnostics"><h3>System diagnostics</h3>
      <p>Check your private repository, authentication, reminders and notification setup. Checks do not modify your notes.</p>
      <button class="btn quiet" id="run-diagnostics" type="button">Run diagnostics</button>
      <div id="diagnostics-results" role="status" aria-live="polite"></div>
    </section>


    <section class="step" id="s3"><h3><span class="n">${n.tz}</span>Your time zone</h3>
      <p class="muted">Reminders and your daily log use it.</p>
      <label for="tz" style="position:absolute;left:-9999px">Time zone</label>
      <select id="tz">${raw(zones().map(z => h`<option ${z === tz ? "selected" : ""}>${z}</option>`).join(""))}</select></section>

    <section class="step" id="s4"><h3><span class="n">${n.push}</span>Reminders on your phone</h3>
      <p class="muted">Optional and free. You can do this later in Settings.</p>
      <ol>
        <li>Install the free <b>ntfy</b> app: <a href="${NTFY_IOS}" target="_blank" rel="noopener">iPhone</a> or <a href="${NTFY_ANDROID}" target="_blank" rel="noopener">Android</a>. Allow notifications when it asks.</li>
        <li>In ntfy, tap <b>+</b> and paste this name. It's long so nobody can guess it; keep it private.</li>
      </ol>
      <div class="copyrow"><code id="topic">${topic}</code><button class="btn quiet" id="copytopic" type="button">Copy</button></div>
      <label class="choices" style="border:0"><input type="checkbox" id="usentfy" ${prev.notify === "pushover" ? "" : "checked"}> Send my reminders to ntfy</label>
      <details class="more"><summary>Use Pushover instead</summary>
        <p class="muted">Pushover is a paid app ($5 once). Enter your user key and an application token from pushover.net.</p>
        <input type="text" id="pouser" placeholder="User key" autocomplete="off">
        <input type="text" id="potoken" placeholder="Application API token" autocomplete="off"></details></section>

    ${raw(first ? "" : assistantBlock(location.origin + "/mcp"))}

    <button class="btn" id="save" type="button" style="width:100%;padding:15px">Save and finish</button>
    <p class="err" id="saveerr" role="alert"></p>
    <div id="after"></div>
  </div>`;

  const drawRepos = (repos) => {
    const priv = repos.filter(r => r.private);
    if (!chosenRepo) chosenRepo = (priv.find(r => /(^|\/)notes/i.test(r.fullName)) || priv[0] || {}).fullName || "";
    $("#repos").innerHTML = repos.length
      ? h`<p style="margin-top:14px"><b>Save notes in:</b></p><div class="choices">${raw(repos.map(r => h`<label><input type="radio" name="repo" value="${r.fullName}" ${r.fullName === chosenRepo ? "checked" : ""}> ${r.fullName}${r.private ? "" : " (public, can't use)"}</label>`).join(""))}</div>`
      : `<p class="err">The key works but can't see any repositories. On GitHub, edit the key and add your notes repository under Repository access.</p>`;
    $("#repos").querySelectorAll("input[name=repo]").forEach(i => i.onchange = () => (chosenRepo = i.value));
    $("#s2").classList.toggle("ok", repos.length > 0);
  };
  const check = async () => {
    const b = $("#check"); b.disabled = true; b.textContent = "Checking…";
    try { drawRepos((await api("/setup/repos", { method: "POST", body: { token: $("#tok").value.trim() } })).repos); }
    catch (e) { if (e instanceof Locked) return showLock(); $("#repos").innerHTML = h`<p class="err">${e.message}</p>`; }
    b.disabled = false; b.textContent = "Check key";
  };
  // Connect GitHub: show a code, she approves it on GitHub, and this page notices on its own.
  let ghActive = false, ghTimer = null, ghBusy = false, ghInterval = 5;
  const ghConnected = (repo, created) => {
    ghActive = false; clearTimeout(ghTimer); chosenRepo = repo;
    $("#gh-flow").innerHTML = h`<p class="gh-ok">✓ Connected. ${created ? "Made" : "Using"} <b>${repo}</b> (private) for your notes.</p>`;
    $("#s2").classList.add("ok");
  };
  const ghFailed = msg => {
    ghActive = false; clearTimeout(ghTimer);
    $("#gh-flow").innerHTML = h`<p class="err">${msg}</p><button class="btn" id="gh-start" type="button">Connect GitHub</button>`;
    $("#gh-start").onclick = ghStart;
  };
  const ghPoll = async () => {
    if (!ghActive || ghBusy) return;
    ghBusy = true; clearTimeout(ghTimer);
    try {
      const r = await api("/setup/github/poll", { method: "POST", body: { timezone: $("#tz").value } });
      if (r.state === "done") ghConnected(r.repo, r.created);
      else if (r.state === "failed") ghFailed(r.message);
      else { if (r.interval) ghInterval = r.interval; ghTimer = setTimeout(ghPoll, ghInterval * 1000); }
    } catch (e) { if (e instanceof Locked) { ghBusy = false; return showLock(); } ghFailed(e.message); }
    ghBusy = false;
  };
  async function ghStart() {
    const b = $("#gh-start"); if (b) { b.disabled = true; b.textContent = "Starting…"; }
    try {
      const f = await api("/setup/github/start", { method: "POST" });
      ghInterval = f.interval;
      $("#gh-flow").innerHTML = h`<p>Your code:</p>
        <div class="copyrow"><code class="ghcode" id="gh-code">${f.userCode}</code></div>
        <a class="btn a-btn" id="gh-open" href="${f.verificationUri}" target="_blank" rel="noopener" style="margin-top:10px">Copy code and open GitHub</a>
        <ol style="margin-top:12px"><li>Paste the code on GitHub and tap <b>Continue</b>.</li><li>Tap <b>Authorize</b>.</li><li>Come back here. This page carries on by itself.</li></ol>
        <p class="muted" id="gh-wait" role="status">Waiting for you to approve on GitHub…</p>`;
      $("#gh-open").addEventListener("click", () => { navigator.clipboard && navigator.clipboard.writeText(f.userCode).catch(() => {}); });
      ghActive = true; ghTimer = setTimeout(ghPoll, ghInterval * 1000);
    } catch (e) { if (e instanceof Locked) return showLock(); ghFailed(e.message); }
  }
  if (connect) {
    $("#gh-start").onclick = ghStart;
    // Coming back from GitHub: check straight away instead of waiting for the next poll.
    const onBack = () => { if (!document.hidden && ghActive && $("#gh-flow")) { clearTimeout(ghTimer); setTimeout(ghPoll, 300); } };
    document.addEventListener("visibilitychange", onBack);
    window.addEventListener("focus", onBack);
  }

  isDirty = () => ghActive || Boolean($("#tok") && $("#tok").value.trim());
  $("#check").onclick = check;
  $("#tok").addEventListener("paste", () => setTimeout(check, 50));
  if (prev.hasToken) check();
  if (!first) wireAssistant(location.origin + "/mcp");
  $("#copytopic").onclick = e => copy(topic, e.target);


  $("#save").onclick = async () => {
    const b = $("#save"); b.disabled = true; b.textContent = "Saving…"; $("#saveerr").textContent = "";
    const pushoverUser = $("#pouser").value.trim(), pushoverToken = $("#potoken").value.trim();
    try {
      if (!chosenRepo) throw new Error(connect ? "Connect GitHub in step 1 first." : "Check your key and pick where to save notes.");
      await api("/setup", { method: "POST", body: {
        token: $("#tok") ? $("#tok").value.trim() : "", repo: chosenRepo, timezone: $("#tz").value,
        ntfyTopic: $("#usentfy").checked && !(pushoverUser && pushoverToken) ? topic : "",
        pushoverUser, pushoverToken } });
      cfg = await api("/config"); drawDate(); $("#tabs").hidden = false; $("#settingsTab").hidden = !cfg.configured;
      showDone(mcpUrl);
    } catch (e) { if (e instanceof Locked) return showLock(); $("#saveerr").textContent = e.message; }
    b.disabled = false; b.textContent = "Save and finish";
  };
};

function showDone(mcpUrl) {
  main.innerHTML = h`<div class="setup">
    <h2>You're set up</h2>
    <section class="step ok"><h3><span class="n">✓</span>Notes are saving to your private repository</h3>
      ${raw(cfg.push ? `<p>Send yourself a test reminder to check your phone gets it.</p><button class="btn quiet" id="test" type="button">Send test notification</button>` : `<p class="muted">Phone notifications are off. You can turn them on in Settings.</p>`)}</section>
    <section class="step"><h3><span class="n">2</span>Connect Claude</h3>
      <ol>
        <li>In Claude, open <b>Settings → Connectors</b> and choose <b>Add custom connector</b>.</li>
        <li>Name it <b>Notes</b> and paste this address:</li>
      </ol>
      <div class="copyrow"><code>${mcpUrl}</code><button class="btn quiet" id="copymcp" type="button">Copy</button></div>
      <ol start="3"><li>A sign-in page opens. Enter the same password you use here and tap <b>Allow</b>.</li>
        <li>Try it: ask Claude <i>"remind me to drink water at 3pm"</i>.</li></ol></section>
    <section class="step"><h3><span class="n">3</span>Keep this app handy</h3>
      <p>This is your notes app's address. Save it somewhere, like a note to yourself:</p>
      <div class="copyrow"><code>${location.origin + "/app"}</code><button class="btn quiet" id="copyapp" type="button">Copy</button></div>
      <p>On your phone, put it on your home screen. iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>. Android: tap <b>⋮</b>, then <b>Add to Home screen</b>.</p></section>
    <a class="btn a-btn" href="#today" style="width:100%;text-align:center;padding:15px">Open my notes</a></div>`;
  const diagnosticButton = $("#run-diagnostics");
  if (diagnosticButton) {
    const run = async () => {
      diagnosticButton.disabled = true;
      $("#diagnostics-results").textContent = "Checking…";
      try {
        const report = await api("/diagnostics");
        $("#diagnostics-results").innerHTML = report.checks.map(item =>
          h`<p><b>${item.status === "pass" ? "✓" : item.status === "fail" ? "✕" : "!"} ${item.id}</b>: ${item.message}</p>`).join("");
      } catch (error) { $("#diagnostics-results").textContent = "Diagnostics failed: " + error.message; }
      diagnosticButton.disabled = false;
    };
    diagnosticButton.onclick = run;
    if (first) run();
  }
  $("#copymcp").onclick = e => copy(mcpUrl, e.target);
  $("#copyapp").onclick = e => copy(location.origin + "/app", e.target);
  const t = $("#test");
  if (t) t.onclick = async () => {
    t.disabled = true; t.textContent = "Sending…";
    try { await api("/test-push", { method: "POST" }); toast("Sent. Check your phone"); t.textContent = "Send again"; }
    catch (e) { toast("Didn't send: " + e.message); t.textContent = "Try again"; }
    t.disabled = false;
  };
}
views.settings = views.setup;

/* ---------- Lock ---------- */
async function showLock(message) {
  closeSheet();
  $("#tabs").hidden = true; $("#composer").hidden = true; $("#lockbtn").hidden = true;
  const info = await fetch("/app/login/info").then(r => r.json()).catch(() => ({ method: "password" }));
  const err = raw(message ? h`<p class="err" role="alert">${message}</p>` : "");
  if (info.method === "github") {
    main.innerHTML = h`<div class="lock" id="lockview"><p>Sign in with the GitHub account that owns your notes.</p>
      <button class="btn" type="button" id="ghbtn">Sign in with GitHub</button>
      <div id="ghcode"></div>${err}</div>`;
    $("#ghbtn").onclick = startGithubLogin;
    return;
  }
  main.innerHTML = h`<form class="lock" id="lockform"><p>Enter the password you chose when you set up the app.</p>
    <label for="key">Password</label><input id="key" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Unlock</button>${err}
    <p class="hint">Forgot it? In the Cloudflare dashboard, open your Worker → Settings → Variables and Secrets, and set a new MCP_BEARER_TOKEN (or PASSWORD).</p></form>`;
  $("#key").focus();
  $("#lockform").onsubmit = async e => {
    e.preventDefault();
    const res = await fetch("/app/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("#key").value }) });
    if (res.ok) { await start(); route(); }
    else showLock((await res.json().catch(() => ({}))).error || "Couldn't unlock. Try again.");
  };
}
async function startGithubLogin() {
  const button = $("#ghbtn");
  button.disabled = true;
  const res = await fetch("/app/login/github/start", { method: "POST" });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { button.disabled = false; return showLock(body.error || "Couldn't reach GitHub. Try again."); }
  $("#ghcode").innerHTML = h`<p>Copy this code, then open GitHub to authorize the sign-in.</p><div class="copyrow"><code class="ghcode">${body.userCode}</code><button class="btn quiet" type="button" id="copy-login-code">Copy code</button></div><p><a class="btn quiet a-btn" href="${body.verificationUri}" target="_blank" rel="noopener">Open GitHub</a></p><p class="muted">If GitHub opens in this tab, return here after approving. Sign-in will continue automatically.</p>`;
  $("#copy-login-code").onclick = e => copy(body.userCode, e.currentTarget);
  pollGithubLogin(body.deviceCode, body.interval);
}
async function pollGithubLogin(deviceCode, interval) {
  const res = await fetch("/app/login/github/poll", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceCode }) });
  const body = await res.json().catch(() => ({}));
  if (body.state === "pending") return setTimeout(() => pollGithubLogin(deviceCode, body.interval || interval), interval * 1000);
  if (body.state === "done") { await start(); return route(); }
  showLock(body.message || body.error || "Couldn't sign in with GitHub. Try again.");
}
function handle(e) {
  if (e instanceof Locked) return isDirty() || sheet.open ? unlockSheet() : showLock();
  toast(e.message || String(e));
}
/** Session ended mid-edit: unlock over the page so nothing typed is lost. */
function unlockSheet() {
  openSheet(h`<form method="dialog" novalidate>
      <h2 id="sheet-title">Unlock to keep going</h2>
      <p class="hint" style="margin:0 0 12px">Your session ended. Your changes are still on the page.</p>
      <label class="field"><span>Password</span><input id="u-key" type="password" autocomplete="current-password" autofocus></label>
      <div class="sheet-actions"><button class="btn" type="submit">Unlock</button></div>
    </form>`, el => {
    el.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const res = await fetch("/app/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("#u-key").value }) });
      if (res.ok) { closeSheet(); toast("Unlocked. Tap Save again."); }
      else sheetError((await res.json().catch(() => ({}))).error || "Couldn't unlock. Try again.");
    };
  });
}

/* ---------- Router ---------- */
let currentHash = location.hash;
async function route() {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  closeSheet(); clearDirty();
  currentHash = location.hash;
  const hash = decodeURIComponent(location.hash.slice(1)) || "today";
  const [view, ...rest] = hash.split("/");
  const arg = rest.join("/");
  document.querySelectorAll("#tabs a").forEach(a => a.removeAttribute("aria-current"));
  const tab = view === "new-goal" ? "goals" : view === "note" || view === "new" ? (arg.startsWith("goals") ? "goals" : "notes") : view;
  const link = $(`#tabs a[href="#${tab}"]`);
  if (link) link.setAttribute("aria-current", "page");
  $("#composer").hidden = view !== "today" && hash !== "today";
  try {
    if (!cfg.configured) { $("#tabs").hidden = true; $("#composer").hidden = true; await views.setup(); window.scrollTo(0, 0); return; }
    if (view === "note") await editor(arg);
    else if (view === "new") await editor(null, arg || "inbox");
    else await (views[view] || views.today)();
  } catch (e) { if (e instanceof Locked) showLock(); else main.innerHTML = h`<p class="err">${e.message}</p>`; }
  window.scrollTo(0, 0);
  if (nextToast) { toast(nextToast); nextToast = null; }
}
window.addEventListener("hashchange", () => {
  if (isDirty() && !confirm("Discard your changes?")) {
    history.replaceState(null, "", currentHash || "#today");
    return;
  }
  route();
});

async function start() {
  cfg = await api("/config");
  drawDate();
  $("#tabs").hidden = !cfg.configured; $("#lockbtn").hidden = false;
  $("#settingsTab").hidden = !cfg.configured;
}

/* ---------- Composer ---------- */
const chips = $("#chips");
chips.innerHTML = TAGS.map(t => `<button type="button" class="chip" aria-pressed="false" data-tag="${t}">#${t}</button>`).join("");
chips.onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
  $("#entry").focus();
};
const when = $("#when"), timebtn = $("#timebtn");
timebtn.onclick = () => {
  when.value = hhmm(Date.now());
  timebtn.hidden = true; when.hidden = false; when.focus();
  if (when.showPicker) try { when.showPicker(); } catch {}
};
const resetWhen = () => { when.value = ""; when.hidden = true; timebtn.hidden = false; };
const composerToggle = $("#composer-toggle");
function setComposerCollapsed(collapsed) {
  $("#composer").dataset.collapsed = String(collapsed);
  composerToggle.setAttribute("aria-expanded", String(!collapsed));
  $("#composer-chevron").textContent = collapsed ? "+" : "−";
  $("#composer-label").textContent = collapsed ? "Quick log" : "Quick log";
  try { localStorage.setItem("daybook-composer-collapsed", String(collapsed)); } catch {}
}
try { setComposerCollapsed(localStorage.getItem("daybook-composer-collapsed") !== "false"); } catch { setComposerCollapsed(true); }
composerToggle.onclick = () => setComposerCollapsed($("#composer").dataset.collapsed !== "true");
$("#composer").onsubmit = async e => {
  e.preventDefault();
  const input = $("#entry");
  if (!input.value.trim()) return input.focus();
  const tags = [...chips.querySelectorAll('[aria-pressed="true"]')].map(b => "#" + b.dataset.tag);
  const entry = [input.value.trim(), ...tags.filter(t => !input.value.includes(t))].join(" ").trim();
  const body = { entry };
  if (!when.hidden && when.value && when.value !== hhmm(Date.now())) body.time = when.value;
  $("#logbtn").disabled = true;
  try {
    await api("/log", { method: "POST", body });
    input.value = ""; resetWhen(); chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", "false"));
    toast(body.time ? "Logged at " + fmt12(body.time) : "Logged"); await views.today();
  } catch (err) { handle(err); }
  $("#logbtn").disabled = false;
};
$("#lockbtn").onclick = async () => {
  if (isDirty() && !confirm("Discard your changes?")) return;
  clearDirty();
  await fetch("/app/logout", { method: "POST" }); showLock();
};

// Coming back to the app (it stays open in the background on a phone): refresh the date and the page.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  drawDate();
  if (Date.now() - hiddenAt > 60_000 && !isDirty() && !sheet.open && !$("#tabs").hidden) route();
});

drawDate();
start().then(route).catch(e => (e instanceof Locked ? showLock() : (main.innerHTML = h`<p class="err">${e.message}</p>`)));
</script>
</body>
</html>
