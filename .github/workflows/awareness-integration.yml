name: Awareness integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  awareness:
    if: github.repository == 'lastnamehurt/notes-server'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:awareness
