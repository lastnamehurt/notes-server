name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Copies made with Deploy to Cloudflare don't need these checks (and have no deploy secrets),
  # so every job runs only in the original repository.
  cli:
    if: github.repository == 'lastnamehurt/notes-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/test-cli.sh

  worker:
    if: github.repository == 'lastnamehurt/notes-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Build the app bundle the installer serves
        run: npm run build:bundle
      - run: npm run typecheck
      - name: Syntax-check inline scripts in app HTML
        run: npm run check:html
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: MCP acceptance test (sign in, tools, notes, scale)
        run: npm run test:mcp

  # People's copies compare against src/version.ts to show "An update is available", so app changes must bump it.
  version:
    if: github.repository == 'lastnamehurt/notes-server' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: App changes bump src/version.ts
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -qx 'src/version.ts'; then
            echo "::error file=src/version.ts::This PR changes src/ but not src/version.ts. Bump VERSION and write a one-line VERSION_NOTE so people's copies see the update."
            exit 1
          fi

  # Deploys to Cloudflare only after every check above has passed on main.
  deploy:
    needs: [worker, cli]
    if: github.repository == 'lastnamehurt/notes-server' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Writes are only for the "Deployed" comment on the merged PR.
    permissions:
      contents: read
      pull-requests: write
    # The url adds a "View deployment" button to the deployment shown on the merged PR.
    environment:
      name: production
      url: ${{ steps.worker.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Deploy the Worker
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # The installer carries this same version of the app, for new installs and for installed apps' Update now.
      - name: Build the app bundle for the installer
        run: npm run build:bundle
      - name: Deploy the installer
        id: installer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c installer/wrangler.jsonc
      - name: Installer address
        run: echo "::notice title=Installer::${{ steps.installer.outputs.deployment-url }}"
      # Tells the merged PR when its change went live. A failure here never fails the deploy.
      - name: Comment on the merged PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
          INSTALLER_URL: ${{ steps.installer.outputs.deployment-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -z "$pr" ]; then echo "No merged PR for ${{ github.sha }}; skipping comment."; exit 0; fi
          version=$(sed -n 's/^export const VERSION = "\([0-9.]*\)".*/\1/p' src/version.ts | head -1)
          when=$(TZ=America/Los_Angeles date '+%b %-d, %-I:%M %p %Z')
          {
            echo "✅ **Deployed to Cloudflare** — ${when}${version:+ (version ${version})}"
            echo
            [ -n "$WORKER_URL" ] && echo "- Worker: ${WORKER_URL}"
            [ -n "$INSTALLER_URL" ] && echo "- Installer: ${INSTALLER_URL}"
            echo "- Commit: \`${GITHUB_SHA::7}\` · [deploy run](${RUN_URL})"
          } > comment.md
          gh pr comment "$pr" --repo "${{ github.repository }}" --body-file comment.md
